    // ============================================================
    // 六-bis、動態層深度整合（INTEGRATION 第 3 節）
    //   資料流：原局 → 旺衰 → 喜用神 → 各流年/大運/流月+原局四支
    //           → BaziRelations.detectGroupRelations + BaziClashTable.lookupClash
    //           → 逐項判喜忌（命理線）→ BaziWuxingHealth.yangshengAdvice（養生線）
    //
    //   ★ 接線而非重寫：合會刑沖破害的「描述」「養生」全來自 5 個資料表，引擎只做
    //     「偵測 → 對照喜用神判吉凶 → 串接」。沖喜神為凶/沖忌神為吉等判讀為通則，
    //     涉及流派處標 TODO_NAKAI。
    // ============================================================

    // 五個資料表的取得：優先用注入，其次全域，其次 Node require；缺席則回 null（降級不報錯）
    var _injectedTables = {};
    function setTables(t) {
        if (!t) return;
        ['relations', 'clash', 'palace', 'health'].forEach(k => { if (t[k]) _injectedTables[k] = t[k]; });
    }
    function _globalScope() {
        return (typeof globalThis !== 'undefined') ? globalThis
            : (typeof window !== 'undefined') ? window
            : (typeof self !== 'undefined') ? self : null;
    }
    function _table(key, globalName, nodeFile) {
        if (_injectedTables[key]) return _injectedTables[key];
        const g = _globalScope();
        if (g && g[globalName]) { _injectedTables[key] = g[globalName]; return g[globalName]; }
        if (typeof require === 'function' && nodeFile) {
            try { const m = require(nodeFile); if (m) { _injectedTables[key] = m; return m; } } catch (e) { /* 缺席降級 */ }
        }
        return null;
    }
    const _relTable = () => _table('relations', 'BaziRelations', './bazi-relations-table.js');
    const _clashTable = () => _table('clash', 'BaziClashTable', './bazi-clash-table.js');
    const _healthTable = () => _table('health', 'BaziWuxingHealth', './bazi-wuxing-health-table.js');

    // 流月地支 → 當令五行（辰未戌丑歸長夏=土）
    const _SEASON_ELEMENT_BY_BRANCH = {
        '寅': '木', '卯': '木', '辰': '土', '巳': '火', '午': '火', '未': '土',
        '申': '金', '酉': '金', '戌': '土', '亥': '水', '子': '水', '丑': '土'
    };

    // 某五行落在喜/忌/閒
    function _yongHit(yongShen, el) {
        if (!yongShen || !el) return '閒';
        if (yongShen.favorable && yongShen.favorable.indexOf(el) !== -1) return '喜';
        if (yongShen.unfavorable && yongShen.unfavorable.indexOf(el) !== -1) return '忌';
        return '閒';
    }
    // 合化/三合/三會：引動的五行落喜→吉、落忌→凶、閒→中（transformsTo 可能是 "火/土"）
    function _verdictByTransform(yongShen, transformsTo) {
        const els = String(transformsTo || '').split('/').filter(Boolean);
        let hasFav = false, hasUnfav = false;
        els.forEach(e => { const h = _yongHit(yongShen, e); if (h === '喜') hasFav = true; else if (h === '忌') hasUnfav = true; });
        if (hasFav && !hasUnfav) return '吉';
        if (hasUnfav && !hasFav) return '凶';
        if (hasFav && hasUnfav) return '吉凶參半';
        return '中';
    }
    // 沖/破/害/刑：剋洩去「忌神所坐之支」偏吉、動搖「喜神所坐之支」偏凶（TODO_NAKAI：流派可調）
    function _verdictByAfflict(yongShen, affectedElement) {
        const h = _yongHit(yongShen, affectedElement);
        if (h === '喜') return '凶';
        if (h === '忌') return '吉';
        return '中';
    }

    /**
     * 單一動態柱（大運/流年/流月/流日）對原局的深度引動分析
     * @param {string} dayStem 日主天干
     * @param {Array}  origPos [{role:'年'|'月'|'日'|'時', branch}]
     * @param {string} timePillar 動態柱干支
     * @param {string} layerLabel '大運'|'流年'|'流月'|'流日'
     * @param {Object} yongShen selectYongShen 結果
     */
    function analyzeActivation(dayStem, origPos, timePillar, layerLabel, yongShen) {
        if (!timePillar) return { layer: layerLabel, pillar: null, note: '無資料（如未起運）' };
        const tStem = timePillar.charAt(0);
        const tBranch = timePillar.charAt(1);
        const origBranches = origPos.map(o => o.branch);
        const allBranches = origBranches.concat([tBranch]);
        const REL = _relTable();
        const CLASH = _clashTable();

        const relations = [];
        const clashes = [];
        let jiCount = 0, xiongCount = 0;
        const favEls = [], unfavEls = [];

        // —— 天干：對日主的十神 ＋ 與日主五合/相剋 ——
        const stemTenGod = getTenGod(dayStem, tStem);
        const stemRule = STEM_INTERACTIONS[dayStem] || {};
        let stemRel = null;
        if (stemRule.combinesWith === tStem) stemRel = `與日主 ${dayStem}${tStem} 相合`;
        else if (stemRule.clashesWith === tStem) stemRel = `剋日主（${tStem}剋${dayStem}）`;

        // —— 地支群關係（與原局四支一起判，只取「引動到此動態支」者）——
        if (REL) {
            const grp = REL.detectGroupRelations(allBranches);
            const involves = arr => arr && arr.indexOf(tBranch) !== -1;

            (grp.sanhui || []).forEach(s => {
                if (!involves(s.involved)) return;
                const v = _verdictByTransform(yongShen, s.transformsTo);
                relations.push({ kind: '三會', name: s.name, involved: s.involved, complete: s.complete, transformsTo: s.transformsTo, verdict: v, reason: `${s.involved.join('')}${s.complete ? '三會' : '半會'}化${s.transformsTo}（${_yongHit(yongShen, s.transformsTo)}神）` });
                if (v === '吉') { jiCount++; favEls.push(s.transformsTo); } else if (v === '凶') { xiongCount++; unfavEls.push(s.transformsTo); }
            });
            (grp.sanhe || []).forEach(s => {
                if (!involves(s.involved)) return;
                const v = _verdictByTransform(yongShen, s.transformsTo);
                relations.push({ kind: '三合', name: s.name, involved: s.involved, complete: s.complete, grade: s.grade, transformsTo: s.transformsTo, verdict: v, reason: `${s.involved.join('')}${s.grade}化${s.transformsTo}（${_yongHit(yongShen, s.transformsTo)}神）` });
                if (v === '吉') { jiCount++; favEls.push(s.transformsTo); } else if (v === '凶') { xiongCount++; unfavEls.push(s.transformsTo); }
            });
            (grp.xing || []).forEach(x => {
                if (!involves(x.involved)) return;
                // 刑為「痛苦的修正」，吉凶依流派，這裡標中性並帶養生提醒
                relations.push({ kind: '刑', name: x.type, involved: x.involved, complete: x.complete, verdict: '中', reason: `${x.involved.join('')}${x.type}${x.complete ? '' : '（半刑）'}`, gentleReminder: x.info && x.info.gentleReminder });
            });

            // —— 成對關係（六合/破/害/暗合）：以「流曜支 × 每個原局支」逐一查表（lookupPair）。
            //    不用 grp.pairs 過濾——同字支時（流曜支與某原局支同字）字元比對會把
            //    原局內部的關係誤歸給流曜、且同一關係重複計數（M1 修正）。
            //    刑不在此處理：交由上方群體偵測（含三刑/半刑/自刑），避免重複。——
            origPos.forEach(o => {
                const lp = REL.lookupPair(tBranch, o.branch);
                if (!lp) return;
                if (lp.liuhe) {
                    const v = _verdictByTransform(yongShen, lp.liuhe.transformsTo);
                    relations.push({ kind: '六合', pair: lp.pair, with: o.role + '支', transformsTo: lp.liuhe.transformsTo, verdict: v, reason: `與${o.role}支${o.branch}六合化${lp.liuhe.transformsTo}（${_yongHit(yongShen, lp.liuhe.transformsTo)}神）`, gentleReminder: lp.liuhe.gentleReminder });
                    if (v === '吉') { jiCount++; favEls.push(lp.liuhe.transformsTo); } else if (v === '凶') { xiongCount++; unfavEls.push(lp.liuhe.transformsTo); }
                }
                if (lp.po) {
                    const affEl = getElementOf(o.branch);
                    const v = _verdictByAfflict(yongShen, affEl);
                    relations.push({ kind: '破', pair: lp.po.pair, with: o.role + '支', affected: o.branch, affectedElement: affEl, verdict: v, reason: `破動${o.role}支${o.branch}(${affEl}·${_yongHit(yongShen, affEl)}神)`, gentleReminder: lp.po.gentleReminder });
                    if (v === '吉') jiCount++; else if (v === '凶') xiongCount++;
                }
                if (lp.hai) {
                    const affEl = getElementOf(o.branch);
                    const v = _verdictByAfflict(yongShen, affEl);
                    relations.push({ kind: '害', pair: lp.hai.pair, with: o.role + '支', affected: o.branch, affectedElement: affEl, verdict: v, reason: `害動${o.role}支${o.branch}(${affEl}·${_yongHit(yongShen, affEl)}神)`, gentleReminder: lp.hai.gentleReminder });
                    if (v === '吉') jiCount++; else if (v === '凶') xiongCount++;
                }
                if (lp.anhe) {
                    relations.push({ kind: '暗合', pair: lp.anhe.pair, with: o.role + '支', verdict: '中', reason: `與${o.role}支${o.branch}暗合（${lp.anhe.links.join('、')}）`, gentleReminder: lp.anhe.gentleReminder });
                }
            });
        }

        // —— 六沖（用 clash 表描述）——
        if (CLASH) {
            origPos.forEach(o => {
                const c = CLASH.lookupClash(o.branch, tBranch);
                if (!c) return;
                const affEl = getElementOf(o.branch);
                const v = _verdictByAfflict(yongShen, affEl);
                clashes.push({ with: o.role + '支' + o.branch, categoryLabel: c.categoryLabel, subtype: c.subtype, affectedElement: affEl, hit: _yongHit(yongShen, affEl), verdict: v, gentleReminder: c.gentleReminder });
                if (v === '吉') jiCount++; else if (v === '凶') xiongCount++;
            });
        }

        const net = (jiCount > xiongCount) ? '偏吉' : (xiongCount > jiCount) ? '偏凶' : '中性';
        const pending = [];
        if (!REL) pending.push('關係合會刑破害（待 bazi-relations-table）');
        if (!CLASH) pending.push('六沖描述（待 bazi-clash-table）');
        return {
            layer: layerLabel, pillar: timePillar, stem: tStem, branch: tBranch,
            stemTenGod: stemTenGod, stemRelation: stemRel,
            relations: relations,
            clashes: CLASH ? clashes : null,            // null = 待資料表（非「無沖」）
            verdict: { ji: jiCount, xiong: xiongCount, net: net, favorableElements: _uniq(favEls), unfavorableElements: _uniq(unfavEls) },
            pending: pending,
            modulesMissing: { relations: !REL, clash: !CLASH }
        };
    }

    /**
     * 動態層總成：以查詢日期取大運/流年/流月/流日，逐柱深度引動分析 ＋ 養生方向
     * @param {Object} chart computeChart 的回傳（需含 pillars / strength / yongShen / meta）
     * @param {number} qY 查詢年（流年/大運基準）
     * @param {number} qM 查詢月（流月基準）
     * @param {number} qD 查詢日（流日基準）
     */
    // —— 跨柱關係偵測：給一組「柱→地支」找刑／沖／破／害／六合／三合／三會（本氣，不含藏干暗合）——
    //   用於：A 大運+流年 牽動本命；B 大運+流年+流月+流日 四柱彼此（本期時運）。
    function _crossRelations(tagged, REL, CLASH) {
        const out = [];
        if (!REL || !tagged.length) return out;
        const brs = tagged.map(t => t.br);
        const roleOf = {};
        tagged.forEach(t => { roleOf[t.br] = roleOf[t.br] || []; if (roleOf[t.br].indexOf(t.role) === -1) roleOf[t.br].push(t.role); });
        const pillarsOf = inv => inv.map(b => (roleOf[b] || ['?']).join('/'));
        const gr = REL.detectGroupRelations(brs);
        (gr.xing || []).forEach(x => out.push({ kind: '刑', type: x.type, involved: x.involved, pillars: pillarsOf(x.involved), complete: x.complete, gentleReminder: x.info && x.info.gentleReminder }));
        (gr.sanhe || []).forEach(s => out.push({ kind: '三合', name: s.name, involved: s.involved, pillars: pillarsOf(s.involved), grade: s.grade, complete: s.complete, transformsTo: s.transformsTo }));
        (gr.sanhui || []).forEach(s => out.push({ kind: '三會', name: s.name, involved: s.involved, pillars: pillarsOf(s.involved), complete: s.complete, transformsTo: s.transformsTo }));
        for (let i = 0; i < tagged.length; i++) for (let j = i + 1; j < tagged.length; j++) {
            const a = tagged[i], b = tagged[j];
            if (a.br === b.br) continue;
            if (CLASH) { const c = CLASH.lookupClash(a.br, b.br); if (c) out.push({ kind: '沖', involved: [a.br, b.br], pillars: [a.role, b.role], categoryLabel: c.categoryLabel, subtype: c.subtype, gentleReminder: c.gentleReminder }); }
            const lp = REL.lookupPair(a.br, b.br);
            if (lp && lp.liuhe) out.push({ kind: '六合', involved: [a.br, b.br], pillars: [a.role, b.role], transformsTo: lp.liuhe.transformsTo, gentleReminder: lp.liuhe.gentleReminder });
            if (lp && lp.po) out.push({ kind: '破', involved: [a.br, b.br], pillars: [a.role, b.role], gentleReminder: lp.po.gentleReminder });
            if (lp && lp.hai) out.push({ kind: '害', involved: [a.br, b.br], pillars: [a.role, b.role], gentleReminder: lp.hai.gentleReminder });
        }
        return out;
    }

    function analyzeDynamics(chart, qY, qM, qD) {
        const p = chart.pillars;
        const dayStem = p.dayPillar.charAt(0);
        const yongShen = chart.yongShen || selectYongShen(p, chart.strength, chart.dayMaster);
        const strength = chart.strength || analyzeStrength(p);
        const origPos = [
            { role: '年', branch: p.yearPillar.charAt(1) },
            { role: '月', branch: p.monthPillar.charAt(1) },
            { role: '日', branch: p.dayPillar.charAt(1) },
            { role: '時', branch: p.hourPillar.charAt(1) }
        ];

        // 動態四曜（與細盤同一套計算）
        const annualGZ = getAnnualPillar(qY);
        const monthlyGZ = getMonthlyPillar(qY, qM, qD);
        const dailyGZ = getDailyPillar(qY, qM, qD);
        const cycle = getLuckCycle(chart.meta.solarBirth, (chart.meta && chart.meta.gender) || '男', p.yearPillar.charAt(0), p.monthPillar);
        const curLuck = cycle.dataMissing ? null : getCurrentLuckPillar(cycle, chart.meta.solarBirth, qY, qM, qD);
        const daYunGZ = curLuck ? curLuck.pillar : null;

        const layers = {
            daYun: analyzeActivation(dayStem, origPos, daYunGZ, '大運', yongShen),
            annual: analyzeActivation(dayStem, origPos, annualGZ, '流年', yongShen),
            monthly: analyzeActivation(dayStem, origPos, monthlyGZ, '流月', yongShen),
            daily: analyzeActivation(dayStem, origPos, dailyGZ, '流日', yongShen)
        };

        // —— 跨柱偵測（★小六太乙師承 2026-08-08 定）——
        //   A 大運+流年 牽動本命：只列「需大運且流年一起（可含本命）」才成的關係（單一流曜×本命已在各層判過）。
        //   B 本期時運：大運+流年+流月+流日 四柱彼此的刑沖破害合會，反映今日/本月行事順暢與否。
        const REL2 = _relTable(), CLASH2 = _clashTable();
        const dyBr = daYunGZ ? daYunGZ.charAt(1) : null;
        const anBr = annualGZ ? annualGZ.charAt(1) : null;
        const moBr = monthlyGZ ? monthlyGZ.charAt(1) : null;
        const dwBr = dailyGZ ? dailyGZ.charAt(1) : null;
        // A：{本命四支 + 大運 + 流年}，留下「同時牽動到大運與流年」的（避免與各層重複）
        const natalTag = origPos.map(o => ({ role: o.role + '(本命)', br: o.branch }));
        const aTag = natalTag.concat(dyBr ? [{ role: '大運', br: dyBr }] : [], anBr ? [{ role: '流年', br: anBr }] : []);
        const hasRole = (ps, kw) => ps.some(p => p.indexOf(kw) !== -1);
        const crossNatal = _crossRelations(aTag, REL2, CLASH2).filter(r => hasRole(r.pillars, '本命') && hasRole(r.pillars, '大運') && hasRole(r.pillars, '流年'));
        // B：{大運 流年 流月 流日} 彼此
        // B 本月時運：大運+流年+流月 彼此；本日時運：加入流日後「因流日而新增」的引動。
        const monthTag = [];
        if (dyBr) monthTag.push({ role: '大運', br: dyBr });
        if (anBr) monthTag.push({ role: '流年', br: anBr });
        if (moBr) monthTag.push({ role: '流月', br: moBr });
        const monthFlow = _crossRelations(monthTag, REL2, CLASH2);
        const dayTag = monthTag.concat(dwBr ? [{ role: '流日', br: dwBr }] : []);
        const dayFlow = _crossRelations(dayTag, REL2, CLASH2).filter(r => r.pillars.some(p => p.indexOf('流日') !== -1));

        // 養生線：旺衰 byElement ＋ 當下流月當令五行
        const HEALTH = _healthTable();
        const seasonElement = _SEASON_ELEMENT_BY_BRANCH[monthlyGZ.charAt(1)] || null;
        const yangsheng = (HEALTH && strength.details && strength.details.byElement)
            ? { seasonElement: seasonElement, advice: HEALTH.yangshengAdvice(strength.details.byElement, seasonElement) }
            : { seasonElement: seasonElement, advice: null, pending: true, note: '待資料表（養生表 bazi-wuxing-health-table）' };

        return {
            query: { year: qY, month: qM, day: qD },
            yongShen: { favorable: yongShen.favorable, unfavorable: yongShen.unfavorable, neutral: yongShen.neutral, method: yongShen.method },
            layers: layers,
            crossPillar: { natal: crossNatal, month: monthFlow, day: dayFlow },
            yangsheng: yangsheng
        };
    }

    /**
     * 主入口：從生日資料產出完整八字分析
     * @param {Object} input { name, gender, year, month, day, hour, targetYear?, targetDate? }
     * @returns {Object} 完整八字資料（可直接 JSON 匯出給 Skill 用）
     */
    function computeChart(input) {
        const { name, gender, year, month, day, hour, targetYear, targetDate } = input;

        const pillars = calculateFourPillars(year, month, day, hour);
        const dayMaster = getDayMasterInfo(pillars.dayPillar);
        const fullTenGods = analyzeFullTenGods(pillars);
        const elementDist = analyzeElementDistribution(pillars);
        const kongWang = calculateKongWang(pillars.dayPillar);
        const strength = analyzeStrength(pillars);
        const yongShen = selectYongShen(pillars, strength, dayMaster);

        const result = {
            meta: {
                name: name || '未命名',
                gender: gender || '未指定',
                solarBirth: { year, month, day, hour },
                generatedAt: new Date().toISOString()
            },
            pillars: pillars,
            dayMaster: dayMaster,
            fullTenGods: fullTenGods,
            elementDistribution: elementDist,
            kongWang: kongWang,
            strength: strength,
            yongShen: yongShen
        };

        // 如果指定了流年，加上流年分析
        if (targetYear) {
            result.annual = analyzeTimePillar(pillars.dayPillar, getAnnualPillar(targetYear), '流年');
            result.annual.targetYear = targetYear;
        }

        // 如果指定了完整日期，加上流年+流月+流日三層分析（淺層，向後相容）
        // 以及動態層深度引動分析（深層：合會刑沖破害 × 喜用神 × 養生）
        if (targetDate && targetDate.year && targetDate.month && targetDate.day) {
            result.dateLayers = analyzeDateLayers(
                pillars.dayPillar, targetDate.year, targetDate.month, targetDate.day
            );
            result.dynamics = analyzeDynamics(result, targetDate.year, targetDate.month, targetDate.day);
        }

        return result;
    }

    // ============================================================
    // 七、細盤（截圖式表格）所需的新計算
    //     —— 十二長生、納音、神煞、大運
    //     以下皆為本次新增；計算規則若涉及流派差異，已於註解標明。
    // ============================================================

    const YANG_STEMS = ['甲', '丙', '戊', '庚', '壬'];
    function isYangStem(stem) { return YANG_STEMS.indexOf(stem) !== -1; }

    // ---- 十二長生 ----
    // 順序固定；陽干順行、陰干逆行。各天干「長生」起點（土寄火）：
    const TWELVE_STAGES = ['長生', '沐浴', '冠帶', '臨官', '帝旺', '衰', '病', '死', '墓', '絕', '胎', '養'];
    const CHANG_SHENG_START = {
        '甲': '亥', '乙': '午', '丙': '寅', '丁': '酉', '戊': '寅',
        '己': '酉', '庚': '巳', '辛': '子', '壬': '申', '癸': '卯'
    };

    /**
     * 取某天干在某地支的十二長生階段
     * 用於「星運」（柱支對日主天干）與「自坐」（柱干坐柱支）
     */
    function getTwelveStage(stem, branch) {
        const start = CHANG_SHENG_START[stem];
        if (!start) return '';
        const startIdx = EARTHLY_BRANCHES.indexOf(start);
        const bIdx = EARTHLY_BRANCHES.indexOf(branch);
        if (startIdx < 0 || bIdx < 0) return '';
        const pos = isYangStem(stem)
            ? (bIdx - startIdx + 12) % 12   // 陽順
            : (startIdx - bIdx + 12) % 12;  // 陰逆
        return TWELVE_STAGES[pos];
    }

    // 由十二長生反查某天干的特定階段所在地支（用於祿神=臨官、羊刃=帝旺）
    function branchOfStage(stem, stageName) {
        for (let i = 0; i < EARTHLY_BRANCHES.length; i++) {
            if (getTwelveStage(stem, EARTHLY_BRANCHES[i]) === stageName) return EARTHLY_BRANCHES[i];
        }
        return null;
    }

    // ---- 六十甲子序號 / 納音 ----
    // 由干支求其在六十甲子中的序號（0-59）
    function ganZhiIndex(ganZhi) {
        const si = HEAVENLY_STEMS.indexOf(ganZhi.charAt(0));
        const bi = EARTHLY_BRANCHES.indexOf(ganZhi.charAt(1));
        if (si < 0 || bi < 0) return -1;
        for (let i = 0; i < 60; i++) {
            if (i % 10 === si && i % 12 === bi) return i;
        }
        return -1;
    }
    function ganZhiFromIndex(idx) {
        idx = ((idx % 60) + 60) % 60;
        return HEAVENLY_STEMS[idx % 10] + EARTHLY_BRANCHES[idx % 12];
    }

    // 六十甲子納音（每 2 柱共用一個納音，共 30 個）
    const NAYIN_30 = [
        '海中金', '爐中火', '大林木', '路旁土', '劍鋒金', '山頭火', '澗下水', '城頭土', '白蠟金', '楊柳木',
        '泉中水', '屋上土', '霹靂火', '松柏木', '長流水', '沙中金', '山下火', '平地木', '壁上土', '金箔金',
        '覆燈火', '天河水', '大驛土', '釵釧金', '桑柘木', '大溪水', '沙中土', '天上火', '石榴木', '大海水'
    ];
    function getNaYin(ganZhi) {
        const idx = ganZhiIndex(ganZhi);
        if (idx < 0) return '';
        return NAYIN_30[Math.floor(idx / 2)] || '';
    }

    // ---- 神煞 ----
    // 【流派說明】神煞取法各家不同。本工具採常見「今法」：
    //   ‧ 干系神煞（天乙、文昌、祿神、羊刃、飛刃）以「日干」為主。
    //   ‧ 三合系神煞（驛馬、桃花、華蓋、將星、劫煞、災煞、亡神）以「日支」起三合局。
    //   ‧ 紅鸞、天喜以「年支」起。
    //   ‧ 天德、月德以「月支（月令）」起。
    //   ‧ 空亡：該柱地支落在「日柱旬空」即標記。
    //   祿神=日干臨官位、羊刃=日干帝旺位、飛刃=羊刃對沖，皆由十二長生推得。
    //   「德秀」因各家差異大，暫未實作（見工具下方說明）。

    // 天乙貴人（甲戊庚牛羊、乙己鼠猴鄉、丙丁豬雞位、壬癸兔蛇藏、六辛逢馬虎）
    const TIANYI = {
        '甲': ['丑', '未'], '戊': ['丑', '未'], '庚': ['丑', '未'],
        '乙': ['子', '申'], '己': ['子', '申'],
        '丙': ['亥', '酉'], '丁': ['亥', '酉'],
        '壬': ['卯', '巳'], '癸': ['卯', '巳'],
        '辛': ['寅', '午']
    };
    // 文昌貴人
    const WENCHANG = {
        '甲': '巳', '乙': '午', '丙': '申', '丁': '酉', '戊': '申',
        '己': '酉', '庚': '亥', '辛': '子', '壬': '寅', '癸': '卯'
    };
    // 沐浴桃花（日干→沐浴位；師承表，2026-08-08 入）
    const MUYU = { '甲': '子', '乙': '巳', '丙': '卯', '丁': '申', '戊': '卯', '己': '申', '庚': '午', '辛': '亥', '壬': '酉', '癸': '寅' };
    // 紅艷桃花（紅艷煞，日干→地支；師承表，2026-08-08 入）
    const HONGYAN = { '甲': '午', '乙': '申', '丙': '寅', '丁': '未', '戊': '辰', '己': '辰', '庚': '戌', '辛': '酉', '壬': '子', '癸': '申' };
    // 十靈日（日柱本身；聰明秀氣；師承，2026-08-08）
    const SHILING = ['甲辰', '乙亥', '丙辰', '丁酉', '戊午', '庚戌', '庚寅', '辛亥', '壬寅', '癸未'];
    // 德秀貴人（依月支三合局 → 天干德/秀；師承，2026-08-08。逐柱標；成格版待議 TODO_NAKAI）
    const DEXIU = {
        fire: { de: ['丙', '丁'], xiu: ['戊', '癸'] },
        water: { de: ['壬', '癸', '戊', '己'], xiu: ['丙', '辛', '甲', '己'] },
        metal: { de: ['庚', '辛'], xiu: ['乙', '庚'] },
        wood: { de: ['甲', '乙'], xiu: ['丁', '壬'] }
    };
    // 金輿（年干與日干 → 地支；主得妻財、富貴；師承，2026-08-08）
    const JINYU = { '甲': '辰', '乙': '巳', '丙': '未', '戊': '未', '丁': '申', '己': '申', '庚': '戌', '辛': '亥', '壬': '丑', '癸': '寅' };
    // 紅鸞（依年支）
    const HONGLUAN = {
        '子': '卯', '丑': '寅', '寅': '丑', '卯': '子', '辰': '亥', '巳': '戌',
        '午': '酉', '未': '申', '申': '未', '酉': '午', '戌': '巳', '亥': '辰'
    };
    function tianXiOf(yearBranch) {
        const hl = HONGLUAN[yearBranch];
        if (!hl) return null;
        const i = EARTHLY_BRANCHES.indexOf(hl);
        return EARTHLY_BRANCHES[(i + 6) % 12]; // 天喜為紅鸞對宮
    }
    // 天德貴人（依月支；值可為天干或地支）
    const TIANDE = {
        '寅': '丁', '卯': '申', '辰': '壬', '巳': '辛', '午': '亥', '未': '甲',
        '申': '癸', '酉': '寅', '戌': '丙', '亥': '乙', '子': '巳', '丑': '庚'
    };
    // 三合局：地支 → 局別
    const TRIAD_GROUP = {
        '申': 'water', '子': 'water', '辰': 'water',
        '寅': 'fire', '午': 'fire', '戌': 'fire',
        '巳': 'metal', '酉': 'metal', '丑': 'metal',
        '亥': 'wood', '卯': 'wood', '未': 'wood'
    };
    // 各三合局對應的神煞地支
    const TRIAD_SHENSHA = {
        '驛馬': { water: '寅', fire: '申', metal: '亥', wood: '巳' },
        '咸池桃花': { water: '酉', fire: '卯', metal: '午', wood: '子' },
        '華蓋': { water: '辰', fire: '戌', metal: '丑', wood: '未' },
        '將星': { water: '子', fire: '午', metal: '酉', wood: '卯' },
        '劫煞': { water: '巳', fire: '亥', metal: '寅', wood: '申' },
        '災煞': { water: '午', fire: '子', metal: '卯', wood: '酉' },
        '亡神': { water: '亥', fire: '巳', metal: '申', wood: '寅' }
    };
    // 年支直取系（孤辰、寡宿依方局；喪門、吊客為年支±2；Nakai 定 2026-08-08）
    const YEARBR_SHENSHA = {
        '孤辰': { '子': '寅', '丑': '寅', '寅': '巳', '卯': '巳', '辰': '巳', '巳': '申', '午': '申', '未': '申', '申': '亥', '酉': '亥', '戌': '亥', '亥': '寅' },
        '寡宿': { '子': '戌', '丑': '戌', '寅': '丑', '卯': '丑', '辰': '丑', '巳': '辰', '午': '辰', '未': '辰', '申': '未', '酉': '未', '戌': '未', '亥': '戌' },
        '喪門': { '子': '寅', '丑': '卯', '寅': '辰', '卯': '巳', '辰': '午', '巳': '未', '午': '申', '未': '酉', '申': '戌', '酉': '亥', '戌': '子', '亥': '丑' },
        '吊客': { '子': '戌', '丑': '亥', '寅': '子', '卯': '丑', '辰': '寅', '巳': '卯', '午': '辰', '未': '巳', '申': '午', '酉': '未', '戌': '申', '亥': '酉' },
        '金匱': { '子': '子', '丑': '酉', '寅': '午', '卯': '卯', '辰': '子', '巳': '酉', '午': '午', '未': '卯', '申': '子', '酉': '酉', '戌': '午', '亥': '卯' },
        '龍德': { '子': '未', '丑': '申', '寅': '酉', '卯': '戌', '辰': '亥', '巳': '子', '午': '丑', '未': '寅', '申': '卯', '酉': '辰', '戌': '巳', '亥': '午' }
    };
    // 三煞（劫煞、災煞、庫煞；以年支與日支三合局「並取」；三合局所沖之方；Nakai 定 2026-08-08）
    const SANSHA_POS = {
        fire:  { '劫煞（三煞）': '亥', '災煞（三煞）': '子', '庫煞（三煞）': '丑' },
        wood:  { '劫煞（三煞）': '申', '災煞（三煞）': '酉', '庫煞（三煞）': '戌' },
        water: { '劫煞（三煞）': '巳', '災煞（三煞）': '午', '庫煞（三煞）': '未' },
        metal: { '劫煞（三煞）': '寅', '災煞（三煞）': '卯', '庫煞（三煞）': '辰' }
    };
    // 月德（依月支三合局 → 天干）
    const YUEDE = { fire: '丙', water: '壬', wood: '甲', metal: '庚' };

    /**
     * 取某柱所帶的神煞清單
     * @param {string} pillarGZ 該柱干支
     * @param {Object} ctx { dayStem, dayBranch, yearBranch, monthBranch, dayKongWang }
     */
    function getShenSha(pillarGZ, ctx) {
        if (!pillarGZ) return [];
        const stem = pillarGZ.charAt(0);
        const branch = pillarGZ.charAt(1);
        const out = [];

        // —— 干系（以日干為主）——
        if (TIANYI[ctx.dayStem] && TIANYI[ctx.dayStem].indexOf(branch) !== -1) {
            out.push('天乙貴人');
            // 自坐貴人：日柱坐在日干的天乙貴人上（僅丁酉、丁亥、癸卯、癸巳四日）
            if (stem === ctx.dayStem && branch === ctx.dayBranch) out.push('自坐貴人');
        }
        if (WENCHANG[ctx.dayStem] === branch) out.push('文昌');
        if (MUYU[ctx.dayStem] === branch) out.push('沐浴桃花');
        if (HONGYAN[ctx.dayStem] === branch) out.push('紅艷桃花');
        if (stem === ctx.dayStem && branch === ctx.dayBranch && SHILING.indexOf(pillarGZ) !== -1) out.push('十靈日');
        if (JINYU[ctx.yearStem] === branch || JINYU[ctx.dayStem] === branch) out.push('金輿');
        const dxGrp = TRIAD_GROUP[ctx.monthBranch];
        if (DEXIU[dxGrp] && (DEXIU[dxGrp].de.indexOf(stem) !== -1 || DEXIU[dxGrp].xiu.indexOf(stem) !== -1)) out.push('德秀貴人');
        if (branchOfStage(ctx.dayStem, '臨官') === branch) out.push('祿神');
        const yangRen = branchOfStage(ctx.dayStem, '帝旺');
        if (yangRen === branch) out.push('羊刃');
        if (yangRen) {
            const feiRen = EARTHLY_BRANCHES[(EARTHLY_BRANCHES.indexOf(yangRen) + 6) % 12];
            if (feiRen === branch) out.push('飛刃');
        }

        // —— 年支系 ——
        if (HONGLUAN[ctx.yearBranch] === branch) out.push('紅鸞');
        if (tianXiOf(ctx.yearBranch) === branch) out.push('天喜');

        // —— 三合系起局：全部以年支起（Nakai 確認 2026-08-08）——
        //    桃花(咸池)、驛馬、華蓋、將星、劫煞、災煞、亡神 皆以「年支」三合局。
        const yGrp = TRIAD_GROUP[ctx.yearBranch];
        if (yGrp) {
            Object.keys(TRIAD_SHENSHA).forEach(name => {
                if (TRIAD_SHENSHA[name][yGrp] === branch) out.push(name);
            });
        }
        // —— 年支直取系（孤辰、寡宿、喪門、吊客）——
        Object.keys(YEARBR_SHENSHA).forEach(name => {
            if (YEARBR_SHENSHA[name][ctx.yearBranch] === branch) out.push(name);
        });
        // —— 三煞（劫煞、災煞、庫煞；年支與日支三合局並取、去重）——
        [TRIAD_GROUP[ctx.yearBranch], TRIAD_GROUP[ctx.dayBranch]].forEach(g => {
            if (!g || !SANSHA_POS[g]) return;
            Object.keys(SANSHA_POS[g]).forEach(name => {
                if (SANSHA_POS[g][name] === branch && out.indexOf(name) === -1) out.push(name);
            });
        });

        // —— 月支系 ——
        const tdVal = TIANDE[ctx.monthBranch];
        if (tdVal && (tdVal === stem || tdVal === branch)) out.push('天德');
        const mgrp = TRIAD_GROUP[ctx.monthBranch];
        if (mgrp && YUEDE[mgrp] === stem) out.push('月德');

        // —— 空亡（落在日柱旬空）——
        if (ctx.dayKongWang && ctx.dayKongWang.indexOf(branch) !== -1) out.push('空亡');

        return out;
    }

    // ---- 大運 ----
    // 節（十二節，非中氣）對應 getTerm 的奇數序號：立春3、驚蟄5…小寒1
    function _jieTimesOfYear(sl, year) {
        const arr = [];
        for (let n = 1; n <= 23; n += 2) {
            const t = sl.getTerm(year, n);
            if (t) arr.push(t);
        }
        return arr;
    }

    /**
     * 計算起運歲數（3 日折 1 年）
     * @param {Object} birth { year, month, day, hour }
     * @param {boolean} forward 順排 true / 逆排 false
     * @returns {{ startAge:number, days:number }}
     */
    function getLuckStartAge(birth, forward) {
        const sl = _getSolarLunar();
        const birthMs = Date.UTC(birth.year, birth.month - 1, birth.day, birth.hour || 0);
        let candidates = [];
        if (forward) {
            candidates = _jieTimesOfYear(sl, birth.year).concat(_jieTimesOfYear(sl, birth.year + 1))
                .filter(t => t > birthMs);
            candidates.sort((a, b) => a - b);
        } else {
            candidates = _jieTimesOfYear(sl, birth.year - 1).concat(_jieTimesOfYear(sl, birth.year))
                .filter(t => t < birthMs);
            candidates.sort((a, b) => b - a);
        }
        if (!candidates.length) {
            // 節氣資料不足（如 2050 年末順排需 2051 年節氣）→ 明確標記，勿默默回 0 歲（M2）
            return { startAge: 0, days: 0, dataMissing: true };
        }
        const days = Math.abs(candidates[0] - birthMs) / 86400000;
        return { startAge: days / 3, days: days };
    }

    /**
     * 排大運：回傳起運資訊與前 N 步大運柱
     * 順逆規則：陽年男 / 陰年女 → 順排；陰年男 / 陽年女 → 逆排（年干定陰陽）。
     * @param {Object} birth { year, month, day, hour }
     * @param {string} gender '男' | '女'
     * @param {string} yearStem 年柱天干
     * @param {string} monthPillar 月柱干支（大運由月柱推排）
     * @param {number} steps 排幾步（預設 10）
     */
    function getLuckCycle(birth, gender, yearStem, monthPillar, steps) {
        steps = steps || 10;
        const yang = isYangStem(yearStem);
        const forward = (yang && gender === '男') || (!yang && gender === '女');
        const startInfo = getLuckStartAge(birth, forward);
        const monthIdx = ganZhiIndex(monthPillar);
        const pillars = [];
        for (let k = 1; k <= steps; k++) {
            const idx = forward ? monthIdx + k : monthIdx - k;
            pillars.push({
                step: k,
                pillar: ganZhiFromIndex(idx),
                startAge: startInfo.startAge + (k - 1) * 10
            });
        }
        return { forward: forward, startAge: startInfo.startAge, startDays: startInfo.days, dataMissing: !!startInfo.dataMissing, pillars: pillars };
    }

    // 以查詢日期計算虛歲（實足年齡，用來定位當前大運）
    function _ageAtDate(birth, qY, qM, qD) {
        const bMs = Date.UTC(birth.year, birth.month - 1, birth.day, birth.hour || 0);
        const qMs = Date.UTC(qY, qM - 1, qD);
        return (qMs - bMs) / (365.2425 * 86400000);
    }

    /**
     * 取查詢日期當下生效的大運柱（未起運回傳 null）
     */
    function getCurrentLuckPillar(cycle, birth, qY, qM, qD) {
        const age = _ageAtDate(birth, qY, qM, qD);
        if (age < cycle.startAge) return null; // 尚未起運
        let cur = null;
        for (let i = 0; i < cycle.pillars.length; i++) {
            if (age >= cycle.pillars[i].startAge) cur = cycle.pillars[i];
            else break;
        }
        return cur;
    }

    // ============================================================
    // 八、細盤表格：把八柱（流日/流月/流年/大運 + 年月日時）整理成
    //     可直接渲染的列資料。截圖式版面由 HTML 負責排版。
    // ============================================================

    /**
     * 計算單一柱的所有列資料
     * @param {string} gz 該柱干支（可為 null → 回傳占位）
     * @param {Object} ctx 共用脈絡（含 dayStem 等）
     * @param {boolean} isDay 是否為日柱（主星顯示元男/元女）
     */
    function computePillarCell(gz, ctx, isDay) {
        if (!gz) {
            return {
                pillar: null, stem: '', branch: '',
                mainStar: '—', stemElement: '', branchElement: '',
                hiddenStems: [], xingYun: '', ziZuo: '',
                kongWang: [], naYin: '', shenSha: []
            };
        }
        const stem = gz.charAt(0);
        const branch = gz.charAt(1);
        const hidden = (BRANCH_HIDDEN_STEMS_FULL[branch] || []).map(hs => ({
            stem: hs, tenGod: getTenGod(ctx.dayStem, hs)
        }));
        const mainStar = isDay
            ? ('元' + (ctx.gender === '女' ? '女' : '男'))
            : getTenGod(ctx.dayStem, stem);
        return {
            pillar: gz,
            stem: stem,
            branch: branch,
            stemElement: getElementOf(stem),
            branchElement: getElementOf(branch),
            mainStar: mainStar,
            hiddenStems: hidden,
            xingYun: getTwelveStage(ctx.dayStem, branch),  // 星運：柱支對日主
            ziZuo: getTwelveStage(stem, branch),            // 自坐：柱干坐柱支
            kongWang: KONG_WANG_RULES[gz] || [],
            naYin: getNaYin(gz),
            shenSha: getShenSha(gz, ctx)
        };
    }

    /**
     * 建立細盤表格資料
     * 欄位順序（左→右）：流日、流月、流年、大運 ｜ 年柱、月柱、日柱、時柱
     * @param {Object} chart computeChart 的回傳
     * @param {number} qY 查詢年（流年/大運基準）
     * @param {number} qM 查詢月（流月基準）
     * @param {number} qD 查詢日（流日基準）
     */
    function buildDetailGrid(chart, qY, qM, qD) {
        const p = chart.pillars;
        const dayStem = p.dayPillar.charAt(0);
        const ctx = {
            dayStem: dayStem,
            dayBranch: p.dayPillar.charAt(1),
            yearStem: p.yearPillar.charAt(0),
            yearBranch: p.yearPillar.charAt(1),
            monthBranch: p.monthPillar.charAt(1),
            dayKongWang: chart.kongWang || [],
            gender: (chart.meta && chart.meta.gender) || '男'
        };

        // 動態四曜
        const annualGZ = getAnnualPillar(qY);
        const monthlyGZ = getMonthlyPillar(qY, qM, qD);
        const dailyGZ = getDailyPillar(qY, qM, qD);

        // 大運
        const birth = chart.meta.solarBirth;
        const cycle = getLuckCycle(birth, ctx.gender, p.yearPillar.charAt(0), p.monthPillar);
        const curLuck = cycle.dataMissing ? null : getCurrentLuckPillar(cycle, birth, qY, qM, qD);
        const daYunGZ = curLuck ? curLuck.pillar : null;

        function ageLabel(a) {
            const yrs = Math.floor(a);
            const mos = Math.round((a - yrs) * 12);
            return mos > 0 ? (yrs + '歲' + mos + '個月') : (yrs + '歲');
        }

        const columns = [
            { role: '流日', sub: qY + '/' + qM + '/' + qD, cell: computePillarCell(dailyGZ, ctx, false), dynamic: true },
            { role: '流月', sub: '節氣月', cell: computePillarCell(monthlyGZ, ctx, false), dynamic: true },
            { role: '流年', sub: qY + '年', cell: computePillarCell(annualGZ, ctx, false), dynamic: true },
            { role: '大運', sub: curLuck ? (ageLabel(curLuck.startAge) + '起') : (cycle.dataMissing ? '節氣資料不足' : '未起運'), cell: computePillarCell(daYunGZ, ctx, false), dynamic: true },
            // 本命四柱：視覺由右至左為「年 月 日 時」（年柱最右），故左→右排為 時、日、月、年
            { role: '時柱', sub: '本命', cell: computePillarCell(p.hourPillar, ctx, false), dynamic: false },
            { role: '日柱', sub: '日主', cell: computePillarCell(p.dayPillar, ctx, true), dynamic: false, isDay: true },
            { role: '月柱', sub: '本命', cell: computePillarCell(p.monthPillar, ctx, false), dynamic: false },
            { role: '年柱', sub: '本命', cell: computePillarCell(p.yearPillar, ctx, false), dynamic: false }
        ];

        return {
            query: { year: qY, month: qM, day: qD },
            luck: {
                forward: cycle.forward,
                startAge: cycle.startAge,
                startAgeLabel: ageLabel(cycle.startAge),
                current: curLuck,
                pillars: cycle.pillars
            },
            columns: columns
        };
    }

    // ============================================================
    // 對外暴露
    // ============================================================

    return {
        // solarLunar 注入接口
        setSolarLunar: setSolarLunar,
        // 資料表注入接口（relations/clash/palace/health；不傳則自動找全域或 require）
        setTables: setTables,
        // 常數（唯讀參考）
        constants: {
            HEAVENLY_STEMS, EARTHLY_BRANCHES, DAY_MASTER_DATA, BRANCH_ELEMENTS,
            ELEMENT_IMAGERY, STEM_INTERACTIONS, BRANCH_INTERACTIONS, TEN_GODS_MAP,
            TEN_GODS_EXPLANATIONS, BRANCH_HIDDEN_STEMS, BRANCH_HIDDEN_STEMS_FULL,
            KONG_WANG_RULES, ELEMENT_GENERATES, ELEMENT_OVERCOMES
        },
        // 基礎工具
        getDayMasterData, getElementOf, getTenGod, getElementRelation,
        // 排盤
        calculateFourPillars, calculateHourPillar, getAnnualPillar,
        getMonthlyPillar, getDailyPillar,
        // 分析
        getDayMasterInfo, analyzeFullTenGods, analyzeElementDistribution,
        calculateKongWang, analyzeElementInteraction, analyzeTenGodsInteraction,
        findTianKeDiChongYears, analyzeTimePillar, analyzeDateLayers,
        // 身強身弱 + 喜用神
        analyzeStrength, selectYongShen,
        // 動態層深度整合（合會刑沖破害 × 喜用神 × 養生）
        analyzeActivation, analyzeDynamics,
        // 細盤新增：十二長生 / 納音 / 神煞 / 大運 / 表格
        getTwelveStage, getNaYin, ganZhiIndex, ganZhiFromIndex,
        getShenSha, getLuckStartAge, getLuckCycle, getCurrentLuckPillar,
        computePillarCell, buildDetailGrid,
        // 整合主入口
        computeChart
    };
}));

</script>
<script>
// 橋接：把 solarLunar 與五個資料表主動注入引擎（缺任一不報錯，引擎內部會降級標「待資料表」）
function _bridgeSolarLunar() {
  var W = (typeof window !== 'undefined') ? window : {};
  var raw = W.solarLunar || (typeof solarLunar !== 'undefined' ? solarLunar : null);
  if (raw && typeof BaziEngine !== 'undefined' && BaziEngine.setSolarLunar) {
    BaziEngine.setSolarLunar(raw); // 引擎內部會自動解開 .default 包裝
  }
  if (typeof BaziEngine !== 'undefined' && BaziEngine.setTables) {
    BaziEngine.setTables({
      relations: W.BaziRelations    || (typeof BaziRelations    !== 'undefined' ? BaziRelations    : null),
      clash:     W.BaziClashTable   || (typeof BaziClashTable   !== 'undefined' ? BaziClashTable   : null),
      palace:    W.BaziPalace       || (typeof BaziPalace       !== 'undefined' ? BaziPalace       : null),
      health:    W.BaziWuxingHealth || (typeof BaziWuxingHealth !== 'undefined' ? BaziWuxingHealth : null)
    });
  }
  return !!raw;
}
_bridgeSolarLunar();
</script>
<script>
/* ============================================================
   年命擇吉模組（Nakai 師承規則 2026-08-08 入卡）
   天干層：出生年干對日干取十神，比肩食神正財偏財正官正印六種為吉
           （十神表直接取用 BaziEngine.constants.TEN_GODS_MAP，單一真源）。
   日支層：吉支＝祿・食祿・陽貴・陰貴・長生（重疊不省略）；
           凶支＝羊刃＋死絕（惟死絕撞該年干任一吉支則不列，Nakai 裁定，
           丙壬死絕全不列、己絕子不列——勿自行「補回」）。
   吉日＝日干支皆吉；凶日＝日干支皆凶（干屬劫財傷官七殺偏印且支屬羊刃死絕）。
   求官＝吉日且日干為正官；求祿＝吉日且日支含祿或食祿。
   ============================================================ */
var ZeJi = (function(){
  'use strict';
  var JIRI_SHISHEN = ['比肩','食神','正財','偏財','正官','正印'];
  var GAN10 = '甲乙丙丁戊己庚辛壬癸';
  var MINGZHU_ZHI = {
    '甲': { ji: { '寅':['祿'], '巳':['食祿'], '未':['陽貴'], '丑':['陰貴'], '亥':['長生'] },
            xiong: { '卯':['羊刃'], '午':['死'], '申':['絕'] } },
    '乙': { ji: { '卯':['祿'], '午':['食祿','長生'], '申':['陽貴'], '子':['陰貴'] },
            xiong: { '辰':['羊刃'], '亥':['死'], '酉':['絕'] } },
    '丙': { ji: { '巳':['祿','食祿'], '酉':['陽貴'], '亥':['陰貴'], '寅':['長生'] },
            xiong: { '午':['羊刃'] } },
    '丁': { ji: { '午':['祿','食祿'], '亥':['陽貴'], '酉':['陰貴','長生'] },
            xiong: { '未':['羊刃'], '寅':['死'], '子':['絕'] } },
    '戊': { ji: { '巳':['祿'], '申':['食祿'], '丑':['陽貴'], '未':['陰貴'], '寅':['長生'] },
            xiong: { '午':['羊刃'], '酉':['死'], '亥':['絕'] } },
    '己': { ji: { '午':['祿'], '酉':['食祿','長生'], '子':['陽貴'], '申':['陰貴'] },
            xiong: { '未':['羊刃'], '寅':['死'] } },
    '庚': { ji: { '申':['祿'], '亥':['食祿'], '丑':['陽貴'], '未':['陰貴'], '巳':['長生'] },
            xiong: { '酉':['羊刃'], '子':['死'], '寅':['絕'] } },
    '辛': { ji: { '酉':['祿'], '子':['食祿','長生'], '寅':['陽貴'], '午':['陰貴'] },
            xiong: { '戌':['羊刃'], '巳':['死'], '卯':['絕'] } },
    '壬': { ji: { '亥':['祿'], '寅':['食祿'], '卯':['陽貴'], '巳':['陰貴'], '申':['長生'] },
            xiong: { '子':['羊刃'] } },
    '癸': { ji: { '子':['祿'], '卯':['食祿','陰貴','長生'], '巳':['陽貴'] },
            xiong: { '丑':['羊刃'], '申':['死'], '午':['絕'] } }
  };
  function tgMap(){ return BaziEngine.constants.TEN_GODS_MAP; }
  function jiRiTianGan(yearStem){
    var m = tgMap()[yearStem], out = [];
    if (!m) return out;
    for (var i = 0; i < GAN10.length; i++){
      var g = GAN10[i];
      if (JIRI_SHISHEN.indexOf(m[g]) !== -1) out.push({ gan: g, shen: m[g] });
    }
    return out;
  }
  function dayGanJi(yearStem, dayGan){
    var m = tgMap()[yearStem], s = m && m[dayGan];
    return (s && JIRI_SHISHEN.indexOf(s) !== -1) ? s : null;
  }
  function mingZhuRiZhi(yearStem, dayZhi){
    var t = MINGZHU_ZHI[yearStem];
    if (!t) return { ji: [], xiong: [] };
    return { ji: (t.ji[dayZhi] || []).slice(), xiong: (t.xiong[dayZhi] || []).slice() };
  }
  /* 自檢不變量（同農民曆卡片同款四道背書），失敗則擇日區暫停顯示 */
  function selfCheck(){
    try {
      var LU10 = {'甲':'寅','乙':'卯','丙':'巳','丁':'午','戊':'巳','己':'午','庚':'申','辛':'酉','壬':'亥','癸':'子'};
      var B12 = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
      var YANG = '甲丙戊庚壬';
      var find = function(obj, label){
        return Object.keys(obj).filter(function(z){ return obj[z].indexOf(label) !== -1; });
      };
      if (jiRiTianGan('甲').map(function(x){ return x.gan; }).join('') !== '甲丙戊己辛癸') return false;
      for (var i = 0; i < GAN10.length; i++){
        var g = GAN10[i], t = MINGZHU_ZHI[g];
        if (jiRiTianGan(g).length !== 6) return false;
        if (find(t.ji, '祿').join('') !== LU10[g]) return false;
        if (find(t.xiong, '羊刃').join('') !== B12[(B12.indexOf(LU10[g]) + 1) % 12]) return false;
        var shi = null, m = tgMap()[g];
        for (var j = 0; j < GAN10.length; j++) if (m[GAN10[j]] === '食神') shi = GAN10[j];
        if (find(t.ji, '食祿').join('') !== LU10[shi]) return false;
        var cs = find(t.ji, '長生');
        if (cs.length !== 1) return false;
        var dir = YANG.indexOf(g) !== -1 ? 1 : -1, ci = B12.indexOf(cs[0]);
        var pairs = [[B12[((ci + 7 * dir) % 12 + 12) % 12], '死'], [B12[((ci + 9 * dir) % 12 + 12) % 12], '絕']];
        for (var k = 0; k < 2; k++){
          var zhi = pairs[k][0], label = pairs[k][1];
          var clash = !!t.ji[zhi], listed = find(t.xiong, label).join('');
          if (clash && listed !== '') return false;
          if (!clash && listed !== zhi) return false;
        }
      }
      return true;
    } catch (e) { return false; }
  }
  /* 逐日掃描：自 startDate 起 days 天 */
  function scan(yearStem, startDate, days){
    var out = [];
    for (var k = 0; k < days; k++){
      var d = new Date(startDate.getTime() + k * 86400000);
      var y = d.getFullYear(), mo = d.getMonth() + 1, da = d.getDate();
      var gz;
      try { gz = BaziEngine.getDailyPillar(y, mo, da); } catch (e) { continue; }
      if (!gz || gz.length < 2) continue;
      var ganShen = dayGanJi(yearStem, gz.charAt(0));
      var z = mingZhuRiZhi(yearStem, gz.charAt(1));
      var isJi = !!ganShen && z.ji.length > 0;
      var isXiong = !ganShen && z.xiong.length > 0;
      out.push({ y: y, m: mo, d: da, gz: gz, ganShen: ganShen, zhiJi: z.ji, zhiXiong: z.xiong,
                 isJi: isJi, isXiong: isXiong,
                 qiuGuan: isJi && ganShen === '正官',
                 qiuLu: isJi && (z.ji.indexOf('祿') !== -1 || z.ji.indexOf('食祿') !== -1) });
    }
    return out;
  }
  return { jiRiTianGan: jiRiTianGan, dayGanJi: dayGanJi, mingZhuRiZhi: mingZhuRiZhi,
           selfCheck: selfCheck, scan: scan, MINGZHU_ZHI: MINGZHU_ZHI };
})();

function toggleZejiMonth(id, btn){
  var el = document.getElementById(id); if (!el) return;
  var open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (btn) btn.classList.toggle('active', !open);
}

function renderZeJi(chart){
  var box = document.getElementById('zeji-result');
  if (!box) return;
  if (!ZeJi.selfCheck()){
    box.innerHTML = '<p class="note" style="color:var(--fire)">年命擇吉自檢未通過，暫停顯示（寧可不答，不答錯）。</p>';
    return;
  }
  var ys = chart.pillars.yearPillar.charAt(0);
  var t = ZeJi.MINGZHU_ZHI[ys];
  var ganList = ZeJi.jiRiTianGan(ys).map(function(x){ return x.gan + '<span class="note">' + x.shen + '</span>'; }).join('　');
  var zhiJiList = Object.keys(t.ji).map(function(z){ return z + '<span class="note">' + t.ji[z].join('・') + '</span>'; }).join('　');
  var zhiXiongList = Object.keys(t.xiong).map(function(z){ return z + '<span class="note">' + t.xiong[z].join('・') + '</span>'; }).join('　');

  var start = new Date(); start.setHours(12, 0, 0, 0);
  var rows = ZeJi.scan(ys, start, 366);
  var qiuGuan = rows.filter(function(r){ return r.qiuGuan; });
  var qiuLu = rows.filter(function(r){ return r.qiuLu; });
  var jiDays = rows.filter(function(r){ return r.isJi; });
  var xiongDays = rows.filter(function(r){ return r.isXiong; });
  var WK = ['日','一','二','三','四','五','六'];
  var weekday = function(r){ return '週' + WK[new Date(r.y, r.m - 1, r.d).getDay()]; };
  var tableByYear = function(list, kind){
    if (!list.length) return '<p class="note">（本年度內無）</p>';
    var seen = {}, order = [];
    list.forEach(function(r){ if (!seen[r.y]){ seen[r.y] = []; order.push(r.y); } seen[r.y].push(r); });
    return order.map(function(y){
      var head = (kind === 'xiong')
        ? '<tr><th>日期</th><th>星期</th><th>日干支</th><th>凶煞（地支）</th></tr>'
        : '<tr><th>日期</th><th>星期</th><th>日干支</th><th>日干十神</th><th>吉神（地支）</th></tr>';
      var body = seen[y].map(function(r){
        var date = '<td class="zt-date">' + r.m + '/' + r.d + '</td><td>' + weekday(r) + '</td><td class="zt-gz">' + r.gz + '</td>';
        if (kind === 'xiong') return '<tr>' + date + '<td class="zt-xiong">' + r.zhiXiong.join('・') + '</td></tr>';
        return '<tr>' + date + '<td class="zt-shen">' + r.ganShen + '</td><td class="zt-ji">' + r.zhiJi.join('・') + '</td></tr>';
      }).join('');
      return '<div class="zeji-year">' + y + ' 年</div><table class="zeji-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
    }).join('');
  };
  // —— 月份摘要帶（每月吉/凶日數，點月展開當月清單；預設展開本月）——
  var byMonth = {}, order = [];
  var addM = function(r, k){ var key = r.y + '-' + r.m; if (!byMonth[key]){ byMonth[key] = { y: r.y, m: r.m, ji: [], xiong: [] }; order.push(key); } byMonth[key][k].push(r); };
  jiDays.forEach(function(r){ addM(r, 'ji'); });
  xiongDays.forEach(function(r){ addM(r, 'xiong'); });
  order.sort(function(a, b){ return byMonth[a].y - byMonth[b].y || byMonth[a].m - byMonth[b].m; });
  var now = new Date(); var curKey = now.getFullYear() + '-' + (now.getMonth() + 1);
  var mid = function(k){ return 'zeji-m-' + k.replace('-', '_'); };
  var tag = function(r){ return r.qiuGuan ? '<span class="zeji-tag zeji-tag-guan">求官</span>' : (r.qiuLu ? '<span class="zeji-tag zeji-tag-lu">求祿</span>' : ''); };
  var monthDetail = function(mm){
    var out = mm.ji.length
      ? '<table class="zeji-table"><thead><tr><th>吉日</th><th>星期</th><th>干支</th><th>吉神・用途</th></tr></thead><tbody>' +
        mm.ji.map(function(r){ return '<tr><td class="zt-date">' + r.m + '/' + r.d + '</td><td>' + weekday(r) + '</td><td class="zt-gz">' + r.gz + '</td><td class="zt-ji">' + r.zhiJi.join('・') + tag(r) + '</td></tr>'; }).join('') + '</tbody></table>'
      : '<p class="note">本月無吉日</p>';
    if (mm.xiong.length){
      out += '<table class="zeji-table"><thead><tr><th>凶日</th><th>星期</th><th>干支</th><th>凶煞</th></tr></thead><tbody>' +
        mm.xiong.map(function(r){ return '<tr><td class="zt-date">' + r.m + '/' + r.d + '</td><td>' + weekday(r) + '</td><td class="zt-gz">' + r.gz + '</td><td class="zt-xiong">' + r.zhiXiong.join('・') + '</td></tr>'; }).join('') + '</tbody></table>';
    }
    return out;
  };
  var strip = order.map(function(k){ var mm = byMonth[k]; var on = (k === curKey);
    return '<span class="zeji-mcell' + (on ? ' cur active' : '') + '" role="button" tabindex="0" onclick="toggleZejiMonth(\'' + mid(k) + '\',this)">' +
      '<span class="zm-label">' + mm.y + '/' + mm.m + '</span>' +
      '<span class="zm-counts"><span class="zm-ji">吉' + mm.ji.length + '</span> <span class="zm-xiong">凶' + mm.xiong.length + '</span></span></span>'; }).join('');
  var details = order.map(function(k){ var mm = byMonth[k]; var on = (k === curKey);
    return '<div id="' + mid(k) + '" class="zeji-mdetail"' + (on ? '' : ' style="display:none"') + '>' + monthDetail(mm) + '</div>'; }).join('');

  box.innerHTML =
    '<p class="note" style="margin-bottom:2px">點月份看當月吉凶日（吉<span style="color:var(--wood)">綠</span>／凶<span style="color:var(--fire)">紅</span>）</p>' +
    '<div class="zeji-strip">' + strip + '</div>' +
    details +
    '<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--muted);font-size:0.85rem">求官吉日（正官臨吉支・' + qiuGuan.length + ' 天）</summary>' + tableByYear(qiuGuan, 'ji') + '</details>' +
    '<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--muted);font-size:0.85rem">求祿吉日（吉干臨祿・食祿・' + qiuLu.length + ' 天）</summary>' + tableByYear(qiuLu, 'ji') + '</details>' +
    '<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--muted);font-size:0.85rem">擇日規則說明</summary>' +
    '<table class="info-table"><tr><td>吉日天干（六干）</td><td>' + ganList + '</td></tr>' +
    '<tr><td>吉日地支</td><td>' + zhiJiList + '</td></tr>' +
    '<tr><td>凶日地支</td><td style="color:var(--fire)">' + zhiXiongList + '</td></tr></table>' +
    '<p class="note" style="margin-top:6px">吉日＝日干（十神屬比肩・食神・正財・偏財・正官・正印）與日支（祿・食祿・陽貴・陰貴・長生）皆吉；凶日＝日干屬劫財・傷官・七殺・偏印且日支屬羊刃・死・絕。干支吉凶不齊者不列。範圍：今日起一年，年柱以立春為界。</p></details>';
}
</script>
<script>
function fillExample() {
  document.getElementById('in-name').value = '';
  document.getElementById('in-gender').value = '男';
  document.getElementById('in-year').value = 1988;
  document.getElementById('in-month').value = 8;
  document.getElementById('in-day').value = 8;
  document.getElementById('in-hour').value = 8;
}

let currentChart = null;

function runChart() {
  // 保險：確保 solarLunar 已注入引擎
  if (typeof _bridgeSolarLunar === 'function') _bridgeSolarLunar();

  const name = document.getElementById('in-name').value || '未命名';
  const gender = document.getElementById('in-gender').value;
  const year = parseInt(document.getElementById('in-year').value);
  const month = parseInt(document.getElementById('in-month').value);
  const day = parseInt(document.getElementById('in-day').value);
  const hour = parseInt(document.getElementById('in-hour').value);

  if (!year || !month || !day || isNaN(hour)) {
    alert('請完整填寫國曆年月日與時辰');
    return;
  }

  try {
    currentChart = BaziEngine.computeChart({ name, gender, year, month, day, hour });
    renderChart(currentChart);
  } catch (e) {
    document.getElementById('result').innerHTML =
      '<div class="placeholder-msg" style="color:var(--fire)">排盤發生錯誤：' + e.message + '</div>';
    console.error(e);
  }
}

function elClass(element) { return element ? 'el-' + element : ''; }

// 大運運勢曲線：以喜用神為尺，把十步大運畫成傾向曲線（示意，非吉凶宣判）
// ============================================================
// 大運分數 v2（師承配分，Nakai 定 2026-08-09）——禁止依外部引擎「更正」
// 五構面：
//   ① 干喜/忌基準 ±10、支喜/忌基準 ±20；建祿／月刃×1.25，明確從格／專旺／化氣×1.5
//   ② 納音五行喜/忌 ±10（取納音末字五行；師承修正三字已在引擎表內）
//   ③ 神煞：吉神每顆 +10（天乙貴人、文昌、天德、德秀貴人）
//           凶煞每顆 −10（劫煞、災煞、亡神）
//           祿神/羊刃/飛刃自本層剔除（統一歸⑤；飛刃⑤無對應項＝不計分）
//           其餘神煞（含月德、空亡、驛馬、咸池、華蓋、將星、沐浴、紅艷等）本層不計
//   ④ 刑沖合（走 analyzeActivation 原判）：三會/三合/六合/六沖 依吉凶判每組 ±10；
//           刑每組 −5；破/害/暗合不計（師承規格未列）
//           天干僅判「大運干對日主」：剋日主 −10；
//           五合依十干化氣（甲己土/乙庚金/丙辛水/丁壬木/戊癸火，標準表）落喜忌 ±10、閒 0
//           【化氣落喜忌沿用引擎「化神落喜忌」原則；如師承另有裁定請改此表】
//   ⑤ 十二長生（大運支對日干）：祿(臨官) +20、長生 +10、羊刃(帝旺) −10、絕 −15
// 回傳 {total, parts:[{label, delta}]}；本函式為大運曲線與合盤橋接共用（鏡射債已清）。
// ============================================================
const XL_STEM_EL = {甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水'};
const XL_BR_EL   = {子:'水',丑:'土',寅:'木',卯:'木',辰:'土',巳:'火',午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水'};
const XL_WUHE_HUA = {'甲己':'土','乙庚':'金','丙辛':'水','丁壬':'木','戊癸':'火'};
const XL_SS_JI   = ['天乙貴人','文昌','天德','德秀貴人'];
const XL_SS_XIONG= ['劫煞','災煞','亡神'];

// 特殊格局對「大運／流年本柱干支喜忌」的唯一加權入口。
// 疑似格、月令八正格與古法外格不加權；納音、神煞、刑沖合、十二長生也不放大。
function specialPatternScoreProfile(chart) {
  const det = chart && chart.strength && chart.strength.details ? chart.strength.details : {};
  const decision = det.specialPatternDecision || {};
  const active = decision.active || null;
  const base = {
    version:'special-pattern-element-weight/v1', tier:'ordinary', pattern:null,
    multiplier:1, stemBase:10, branchBase:20, stemScore:10, branchScore:20,
    isWeighted:false, appliesTo:'direct-stem-branch-favorability-only',
    excludes:['疑似特殊格','月令八正格','古法外格','納音','神煞','刑沖合','十二長生']
  };
  if (active && ['從格','專旺格','化氣格'].indexOf(active.family) !== -1) {
    return Object.assign({}, base, {
      tier:'clear-special', pattern:active.pattern || active.family, multiplier:1.5,
      stemScore:15, branchScore:30, isWeighted:true,
      label:(active.pattern || active.family) + '・明確特殊格'
    });
  }
  const mp = det.monthPattern;
  if (mp && mp.status === '成立' && (mp.type === '建祿格' || mp.type === '月刃格')) {
    return Object.assign({}, base, {
      tier:'month-special', pattern:mp.type, multiplier:1.25,
      stemScore:12.5, branchScore:25, isWeighted:true,
      label:mp.type + '・月令特殊格'
    });
  }
  return Object.assign({}, base, {label:'普通正格／疑似格不加權'});
}

function luckPillarScoreV2(chart, luckGZ) {
  const parts = [];
  const push = (label, delta) => { if (delta) parts.push({ label: label, delta: delta }); };
  const ys = chart.yongShen;
  const hit = el => (ys.favorable.indexOf(el) !== -1) ? 1 : ((ys.unfavorable || []).indexOf(el) !== -1 ? -1 : 0);
  const specialScoring = specialPatternScoreProfile(chart);
  const weightedLabel = specialScoring.isWeighted ? '（' + specialScoring.label + '×' + specialScoring.multiplier + '）' : '';
  const stem = luckGZ.charAt(0), branch = luckGZ.charAt(1);
  const p = chart.pillars, dayStem = p.dayPillar.charAt(0);
  // ① 干支喜忌
  push('干' + stem + (hit(XL_STEM_EL[stem]) > 0 ? '喜' : hit(XL_STEM_EL[stem]) < 0 ? '忌' : '') + weightedLabel,
    hit(XL_STEM_EL[stem]) * specialScoring.stemScore);
  push('支' + branch + (hit(XL_BR_EL[branch]) > 0 ? '喜' : hit(XL_BR_EL[branch]) < 0 ? '忌' : '') + weightedLabel,
    hit(XL_BR_EL[branch]) * specialScoring.branchScore);
  // ② 納音
  try {
    const ny = BaziEngine.getNaYin(luckGZ);
    if (ny) {
      const nyEl = ny.slice(-1);
      push('納音' + ny + (hit(nyEl) > 0 ? '喜' : hit(nyEl) < 0 ? '忌' : ''), hit(nyEl) * 10);
    }
  } catch (e) {}
  // ③ 神煞（剔除祿神/羊刃/飛刃）
  try {
    const ctx = {
      dayStem: dayStem, dayBranch: p.dayPillar.charAt(1),
      yearStem: p.yearPillar.charAt(0), yearBranch: p.yearPillar.charAt(1),
      monthBranch: p.monthPillar.charAt(1),
      dayKongWang: chart.kongWang || [],
      gender: (chart.meta && chart.meta.gender) || '男'
    };
    (BaziEngine.getShenSha(luckGZ, ctx) || []).forEach(name => {
      if (XL_SS_JI.indexOf(name) !== -1) push('吉神·' + name, 10);
      else if (XL_SS_XIONG.indexOf(name) !== -1) push('凶煞·' + name, -10);
    });
  } catch (e) {}
  // ④ 刑沖合（analyzeActivation 原始路徑）
  try {
    const origPos = [
      { role: '年', branch: p.yearPillar.charAt(1) },
      { role: '月', branch: p.monthPillar.charAt(1) },
      { role: '日', branch: p.dayPillar.charAt(1) },
      { role: '時', branch: p.hourPillar.charAt(1) }
    ];
    const act = BaziEngine.analyzeActivation(dayStem, origPos, luckGZ, '大運', ys);
    (act.relations || []).forEach(r => {
      if (r.kind === '刑') push('刑·' + (r.name || r.involved.join('')), -5);
      else if (r.kind === '三會' || r.kind === '三合' || r.kind === '六合') {
        if (r.verdict === '吉') push(r.kind + '化' + r.transformsTo + '吉', 10);
        else if (r.verdict === '凶') push(r.kind + '化' + r.transformsTo + '凶', -10);
      }
      // 破/害/暗合：師承規格未列，不計
    });
    (act.clashes || []).forEach(c => {
      if (c.verdict === '吉') push('沖' + c.with + '吉', 10);
      else if (c.verdict === '凶') push('沖' + c.with + '凶', -10);
    });
    // 天干：僅對日主
    const sr = { '甲':{c:'己',k:'庚'},'乙':{c:'庚',k:'辛'},'丙':{c:'辛',k:'壬'},'丁':{c:'壬',k:'癸'},'戊':{c:'癸',k:null},'己':{c:'甲',k:null},'庚':{c:'乙',k:'甲'},'辛':{c:'丙',k:'乙'},'壬':{c:'丁',k:'丙'},'癸':{c:'戊',k:'丁'} }[dayStem];
    if (sr) {
      if (sr.k === stem) push('剋日主(' + stem + ')', -10);
      if (sr.c === stem) {
        const hua = XL_WUHE_HUA[[dayStem, stem].sort().join('')] || XL_WUHE_HUA[[stem, dayStem].sort().join('')] ||
                    XL_WUHE_HUA[dayStem + stem] || XL_WUHE_HUA[stem + dayStem];
        if (hua) {
          const h = hit(hua);
          if (h) push('合日主化' + hua + (h > 0 ? '喜' : '忌'), h * 10);
        }
      }
    }
  } catch (e) {}
  // ⑤ 十二長生
  try {
    const stage = BaziEngine.getTwelveStage(dayStem, branch);
    if (stage === '臨官') push('日主祿', 20);
    else if (stage === '長生') push('長生', 10);
    else if (stage === '帝旺') push('羊刃', -10);
    else if (stage === '絕') push('絕', -15);
  } catch (e) {}
  let total = 0;
  parts.forEach(x => { total += x.delta; });
  return { total: total, parts: parts, specialScoring:specialScoring };
}

// ============================================================
// 流年分數 v2（Nakai 定 2026-08-09）
// ① 當年所處大運的五構面總分 × 1/2，作為基礎分
// ② 流年干支喜忌：干基準 ±10、支基準 ±20；特殊格比例與大運相同
// ③ 流年納音五行喜忌 ±10
// ④ 流年神煞：沿用大運每顆 ±10，並納入月德、金輿與三煞；
//    劫煞/災煞的普通名與「（三煞）」標記視為同一顆，禁止重複扣分
// ⑤ 流年柱對本命日柱及當年大運柱：天干沖 −10、五合依化氣喜忌 ±10；
//    地支三會/三合/六合/六沖依原判 ±10、刑 −5；本氣相剋依受剋五行喜忌 ±10；破/害/暗合不計
// ⑥ 十二長生（流年支對日干）：祿 +20、長生 +10、羊刃 −10、絕 −15
// 回傳 {total, parts, luckGZ, luckScore}；曲線與合盤橋接共用，禁止鏡射計分。
// ============================================================
const XL_ANNUAL_SS_JI = ['天乙貴人','文昌','天德','月德','德秀貴人','金輿'];
const XL_ANNUAL_SS_XIONG = [
  { label:'劫煞', aliases:['劫煞（三煞）','劫煞'] },
  { label:'災煞', aliases:['災煞（三煞）','災煞'] },
  { label:'庫煞', aliases:['庫煞（三煞）'] },
  { label:'亡神', aliases:['亡神'] }
];
const XL_ELEMENT_OVERCOMES = { 木:'土', 土:'水', 水:'火', 火:'金', 金:'木' };
function annualPillarScoreV2(chart, annualGZ, luckGZ) {
  const parts = [];
  const push = (label, delta, keepZero) => { if (delta || keepZero) parts.push({ label: label, delta: delta }); };
  const ys = chart.yongShen;
  const hit = el => (ys.favorable.indexOf(el) !== -1) ? 1 : ((ys.unfavorable || []).indexOf(el) !== -1 ? -1 : 0);
  const specialScoring = specialPatternScoreProfile(chart);
  const weightedLabel = specialScoring.isWeighted ? '（' + specialScoring.label + '×' + specialScoring.multiplier + '）' : '';
  const stem = annualGZ.charAt(0), branch = annualGZ.charAt(1);
  const p = chart.pillars, dayStem = p.dayPillar.charAt(0), dayBranch = p.dayPillar.charAt(1);

  // ① 大運半分基礎
  const luckResult = luckGZ ? luckPillarScoreV2(chart, luckGZ) : { total: 0 };
  push('大運' + (luckGZ || '未起運') + '半分基礎', luckResult.total / 2, true);

  // ② 流年干支喜忌
  push('流年干' + stem + (hit(XL_STEM_EL[stem]) > 0 ? '喜' : hit(XL_STEM_EL[stem]) < 0 ? '忌' : '') + weightedLabel,
    hit(XL_STEM_EL[stem]) * specialScoring.stemScore);
  push('流年支' + branch + (hit(XL_BR_EL[branch]) > 0 ? '喜' : hit(XL_BR_EL[branch]) < 0 ? '忌' : '') + weightedLabel,
    hit(XL_BR_EL[branch]) * specialScoring.branchScore);

  // ③ 流年納音
  try {
    const ny = BaziEngine.getNaYin(annualGZ);
    if (ny) {
      const nyEl = ny.slice(-1);
      push('流年納音' + ny + (hit(nyEl) > 0 ? '喜' : hit(nyEl) < 0 ? '忌' : ''), hit(nyEl) * 10);
    }
  } catch (e) {}

  // ④ 流年神煞（祿/羊刃仍統一歸⑥）
  try {
    const ctx = {
      dayStem: dayStem, dayBranch: dayBranch,
      yearStem: p.yearPillar.charAt(0), yearBranch: p.yearPillar.charAt(1),
      monthBranch: p.monthPillar.charAt(1),
      dayKongWang: chart.kongWang || [],
      gender: (chart.meta && chart.meta.gender) || '男'
    };
    const ss = BaziEngine.getShenSha(annualGZ, ctx) || [];
    XL_ANNUAL_SS_JI.forEach(name => {
      if (ss.indexOf(name) !== -1) push('流年吉神·' + name, 10);
    });
    XL_ANNUAL_SS_XIONG.forEach(rule => {
      const found = rule.aliases.find(name => ss.indexOf(name) !== -1);
      if (found) push('流年凶煞·' + (found.indexOf('（三煞）') !== -1 ? found : rule.label), -10);
    });
  } catch (e) {}

  // ⑤ 天干沖合：分別對本命日干與當年大運干
  const scoreStemRelation = (role, refStem) => {
    if (!refStem) return;
    const hua = XL_WUHE_HUA[refStem + stem] || XL_WUHE_HUA[stem + refStem];
    if (hua) {
      const h = hit(hua);
      if (h) push('流年干與' + role + refStem + '五合化' + hua + (h > 0 ? '喜' : '忌'), h * 10);
      return;
    }
    const sr = BaziEngine.constants && BaziEngine.constants.STEM_INTERACTIONS && BaziEngine.constants.STEM_INTERACTIONS[refStem];
    if (sr && sr.clashesWith === stem) push('流年干' + stem + '沖' + role + refStem, -10);
  };
  scoreStemRelation('日干', dayStem);
  scoreStemRelation('大運干', luckGZ && luckGZ.charAt(0));

  // ⑤ 地支刑沖合：只取本命日支＋當年大運支，並沿用大運 activation 判分
  try {
    const origPos = [{ role:'日', branch:dayBranch }];
    if (luckGZ) origPos.push({ role:'大運', branch:luckGZ.charAt(1) });
    const act = BaziEngine.analyzeActivation(dayStem, origPos, annualGZ, '流年', ys);
    (act.relations || []).forEach(r => {
      if (r.kind === '刑') push('流年刑·' + (r.name || (r.involved || []).join('')), -5);
      else if (r.kind === '三會' || r.kind === '三合' || r.kind === '六合') {
        if (r.verdict === '吉') push('流年' + r.kind + '化' + r.transformsTo + '吉', 10);
        else if (r.verdict === '凶') push('流年' + r.kind + '化' + r.transformsTo + '凶', -10);
      }
      // 破/害/暗合：沿用大運規格，不計分
    });
    (act.clashes || []).forEach(c => {
      if (c.verdict === '吉') push('流年沖' + c.with + '吉', 10);
      else if (c.verdict === '凶') push('流年沖' + c.with + '凶', -10);
    });
  } catch (e) {}

  // ⑤ 地支本氣五行相剋：剋動喜神所屬之支為凶，剋動忌神所屬之支為吉
  const scoreBranchOvercome = (role, refBranch) => {
    if (!refBranch) return;
    const annualEl = XL_BR_EL[branch], refEl = XL_BR_EL[refBranch];
    let affectedEl = null, label = '';
    if (XL_ELEMENT_OVERCOMES[annualEl] === refEl) {
      affectedEl = refEl;
      label = '流年支' + branch + '剋' + role + refBranch;
    } else if (XL_ELEMENT_OVERCOMES[refEl] === annualEl) {
      affectedEl = annualEl;
      label = role + refBranch + '剋流年支' + branch;
    }
    if (!affectedEl) return;
    const h = hit(affectedEl);
    if (h > 0) push(label + '凶', -10);
    else if (h < 0) push(label + '吉', 10);
  };
  scoreBranchOvercome('日支', dayBranch);
  scoreBranchOvercome('大運支', luckGZ && luckGZ.charAt(1));

  // ⑥ 十二長生
  try {
    const stage = BaziEngine.getTwelveStage(dayStem, branch);
    if (stage === '臨官') push('流年日主祿', 20);
    else if (stage === '長生') push('流年長生', 10);
    else if (stage === '帝旺') push('流年羊刃', -10);
    else if (stage === '絕') push('流年絕', -15);
  } catch (e) {}

  let total = 0;
  parts.forEach(x => { total += x.delta; });
  return { total: total, parts: parts, luckGZ: luckGZ || null, luckScore: luckResult.total, specialScoring:specialScoring };
}

// 依流年曲線既有的「起運歲四捨五入」年界，取該年所處大運；
// 讓曲線分界、點擊明細與基礎分使用同一套年份映射。
function annualLuckPillar(cycle, birthYear, year) {
  const age = year - birthYear;
  let cur = null;
  (cycle.pillars || []).forEach(pl => {
    if (age >= Math.round(pl.startAge)) cur = pl;
  });
  return cur;
}

// 流年曲線與合盤橋接共用的唯一資料產生器。
function annualScoreDataV2(chart, cycle) {
  const pil = cycle.pillars || [], birthY = chart.meta.solarBirth.year;
  if (!pil.length) return { points: [], truncated: false };
  const startAge = isFinite(pil[0].startAge) ? pil[0].startAge : 1;
  const lastAge = isFinite(pil[pil.length - 1].startAge) ? pil[pil.length - 1].startAge : (startAge + (pil.length - 1) * 10);
  const startYear = birthY + Math.round(startAge);
  const count = Math.max(10, Math.round(lastAge + 10 - startAge));
  const points = [];
  let truncated = false;
  for (let i = 0; i < count; i++) {
    const year = startYear + i;
    let annualGZ;
    try { annualGZ = BaziEngine.getAnnualPillar(year); }
    catch (e) { truncated = true; break; }
    const luck = annualLuckPillar(cycle, birthY, year);
    const r = annualPillarScoreV2(chart, annualGZ, luck && luck.pillar);
    points.push({
      year: year, age: Math.round(startAge) + i, gz: annualGZ,
      score: r.total, parts: r.parts, luckGz: r.luckGZ, luckScore: r.luckScore,
      specialScoring:r.specialScoring
    });
  }
  return { points: points, truncated: truncated };
}

function luckCurveHtml(chart) {
  try {
    if (!chart || !chart.yongShen || !chart.yongShen.favorable || !chart.pillars || !chart.meta) return '';
    if (!(window.BaziEngine && BaziEngine.getLuckCycle)) return '';
    const ys = chart.yongShen;
    const cycle = BaziEngine.getLuckCycle(chart.meta.solarBirth, chart.meta.gender || '男',
      chart.pillars.yearPillar.charAt(0), chart.pillars.monthPillar);
    if (!cycle || !cycle.pillars || !cycle.pillars.length) return '';
    const pts = cycle.pillars.map(pl => {
      const gz = pl.pillar;
      const r = luckPillarScoreV2(chart, gz);
      return { gz: gz, age: isFinite(pl.startAge) ? Math.round(pl.startAge) : '', score: r.total, parts: r.parts };
    });
    const maxAbs = Math.max(30, ...pts.map(p => Math.abs(p.score)));
    let curGz = null;
    try {
      const now = new Date();
      const cur = BaziEngine.getCurrentLuckPillar(cycle, chart.meta.solarBirth, now.getFullYear(), now.getMonth() + 1, now.getDate());
      curGz = cur ? cur.pillar : null;
    } catch (e) {}
    const W = 680, H = 300, mL = 52, mR = 16, mT = 46, mB = 46;
    const plotW = W - mL - mR, plotH = H - mT - mB, n = pts.length;
    const baseY = mT + plotH / 2;
    const xAt = i => mL + (n <= 1 ? plotW / 2 : plotW * i / (n - 1));
    const yAt = s => baseY - (s / maxAbs) * (plotH / 2);
    const poly = pts.map((p, i) => `${xAt(i).toFixed(1)},${yAt(p.score).toFixed(1)}`).join(' ');
    let dots = '', xlabels = '', curRing = '';
    pts.forEach((p, i) => {
      const x = xAt(i), y = yAt(p.score);
      const col = p.score > 0 ? 'var(--wood)' : (p.score < 0 ? 'var(--fire)' : 'var(--muted)');
      const r = Math.abs(p.score) >= maxAbs * 0.8 ? 6 : 5;
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" style="fill:${col}"/>`;
      xlabels += `<text x="${x.toFixed(1)}" y="${H - mB + 18}" text-anchor="middle" style="fill:var(--text);font-size:12px">${p.gz}</text>`
              +  `<text x="${x.toFixed(1)}" y="${H - mB + 31}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${p.age}</text>`;
      if (curGz && p.gz === curGz) curRing = `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9.5" fill="none" style="stroke:var(--gold);stroke-width:2"/>`;
    });
    const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="大運運勢曲線">`
      + `<line x1="${mL}" y1="${yAt(maxAbs)}" x2="${W - mR}" y2="${yAt(maxAbs)}" style="stroke:var(--muted);opacity:.35"/>`
      + `<line x1="${mL}" y1="${baseY}" x2="${W - mR}" y2="${baseY}" style="stroke:var(--muted);stroke-width:1.2"/>`
      + `<line x1="${mL}" y1="${yAt(-maxAbs)}" x2="${W - mR}" y2="${yAt(-maxAbs)}" style="stroke:var(--muted);opacity:.35"/>`
      + `<text x="${mL - 8}" y="${yAt(maxAbs) + 4}" text-anchor="end" style="fill:var(--muted);font-size:10px">喜</text>`
      + `<text x="${mL - 8}" y="${baseY + 4}" text-anchor="end" style="fill:var(--muted);font-size:10px">平</text>`
      + `<text x="${mL - 8}" y="${yAt(-maxAbs) + 4}" text-anchor="end" style="fill:var(--muted);font-size:10px">忌</text>`
      + `<polyline points="${poly}" fill="none" style="stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/>`
      + dots + curRing + xlabels + `</svg>`;
    const sw = specialPatternScoreProfile(chart);
    return `\n    <h2>大運運勢曲線</h2>\n    ${svg}\n    <p class="note">五構面計分（師承配分）：①干支喜忌（普通基準干±10、支±20；本盤${sw.isWeighted ? sw.label + '，干±' + sw.stemScore + '、支±' + sw.branchScore : '無特殊加權'}，喜 ${ys.favorable.join('')}）②納音五行喜忌 ±10 ③神煞（吉神 +10：天乙／文昌／天德／德秀；凶煞 −10：劫煞／災煞／亡神）④與本命四柱之合會沖依吉凶判 ±10、刑 −5（天干僅判對日主）⑤十二長生：祿 +20、長生 +10、羊刃 −10、絕 −15。特殊格只放大①本柱干支喜忌，其餘構面不加權。縱軸依本盤分數幅度正規化。金圈為現行大運。此為運勢傾向示意，非吉凶宣判，未計流年與實際處境。</p>`;
  } catch (e) { console.error('luckCurveHtml', e); return ''; }
}

// 流年運勢曲線（全人生）：從起運到第十步大運結束（約百年），採 annualScoreDataV2 共用計分；標大運分界與干支
function annualCurveHtml(chart) {
  try {
    if (!chart || !chart.yongShen || !chart.yongShen.favorable || !chart.pillars || !chart.meta) return '';
    if (!(window.BaziEngine && BaziEngine.getAnnualPillar && BaziEngine.getLuckCycle)) return '';
    if (!chart.meta.solarBirth) return '';
    const ys = chart.yongShen;
    const cycle = BaziEngine.getLuckCycle(chart.meta.solarBirth, chart.meta.gender || '男',
      chart.pillars.yearPillar.charAt(0), chart.pillars.monthPillar);
    if (!cycle || !cycle.pillars || !cycle.pillars.length) return '';
    const pil = cycle.pillars;
    const startAge = isFinite(pil[0].startAge) ? pil[0].startAge : 1;
    const annualData = annualScoreDataV2(chart, cycle);
    const pts = annualData.points, truncated = annualData.truncated;
    if (!pts.length) return '';
    const nowY = new Date().getFullYear();
    const W = 880, H = 320, mL = 48, mR = 14, mT = 34, mB = 42;
    const plotW = W - mL - mR, plotH = H - mT - mB, n = pts.length, baseY = mT + plotH / 2;
    const maxAbs = Math.max(30, ...pts.map(p => Math.abs(p.score)));
    const xAt = i => mL + (n <= 1 ? plotW / 2 : plotW * i / (n - 1));
    const yAt = s => baseY - (s / maxAbs) * (plotH / 2);
    // 大運分界（每步起始年份的索引）與干支
    let vlines = '', duLabels = '';
    pil.forEach((pl, k) => {
      const idx = Math.round((isFinite(pl.startAge) ? pl.startAge : startAge + k * 10) - startAge);
      if (idx < 0 || idx >= n) return;
      const x = xAt(idx);
      vlines += `<line x1="${x.toFixed(1)}" y1="${mT}" x2="${x.toFixed(1)}" y2="${H - mB}" style="stroke:var(--muted);opacity:.22"/>`;
      const idxNext = (k + 1 < pil.length) ? Math.round((isFinite(pil[k + 1].startAge) ? pil[k + 1].startAge : startAge + (k + 1) * 10) - startAge) : n;
      const cx = (x + xAt(Math.min(idxNext, n - 1))) / 2;
      duLabels += `<text x="${cx.toFixed(1)}" y="${mT - 8}" text-anchor="middle" style="fill:var(--gold);font-size:11px">${pl.pillar}</text>`;
      duLabels += `<text x="${x.toFixed(1)}" y="${H - mB + 16}" text-anchor="middle" style="fill:var(--muted);font-size:9px">${pts[idx] ? pts[idx].age : ''}歲</text>`;
    });
    const poly = pts.map((p, i) => `${xAt(i).toFixed(1)},${yAt(p.score).toFixed(1)}`).join(' ');
    let dots = '', curRing = '';
    pts.forEach((p, i) => {
      const x = xAt(i), y = yAt(p.score);
      const col = p.score > 0 ? 'var(--wood)' : (p.score < 0 ? 'var(--fire)' : 'var(--muted)');
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" style="fill:${col}"/>`;
      if (p.year === nowY) curRing = `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="none" style="stroke:var(--gold);stroke-width:2"/>`
        + `<text x="${x.toFixed(1)}" y="${mT - 20}" text-anchor="middle" style="fill:var(--gold);font-size:10px">今 ${p.age}歲</text>`;
    });
    const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="流年運勢曲線">`
      + `<line x1="${mL}" y1="${yAt(maxAbs)}" x2="${W - mR}" y2="${yAt(maxAbs)}" style="stroke:var(--muted);opacity:.35"/>`
      + `<line x1="${mL}" y1="${baseY}" x2="${W - mR}" y2="${baseY}" style="stroke:var(--muted);stroke-width:1.2"/>`
      + `<line x1="${mL}" y1="${yAt(-maxAbs)}" x2="${W - mR}" y2="${yAt(-maxAbs)}" style="stroke:var(--muted);opacity:.35"/>`
      + vlines
      + `<text x="${mL - 6}" y="${yAt(maxAbs) + 4}" text-anchor="end" style="fill:var(--muted);font-size:10px">喜</text>`
      + `<text x="${mL - 6}" y="${baseY + 4}" text-anchor="end" style="fill:var(--muted);font-size:10px">平</text>`
      + `<text x="${mL - 6}" y="${yAt(-maxAbs) + 4}" text-anchor="end" style="fill:var(--muted);font-size:10px">忌</text>`
      + `<polyline points="${poly}" fill="none" style="stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round"/>`
      + dots + duLabels + curRing + `</svg>`;
    const truncNote = truncated ? `曲線截至 ${pts[pts.length - 1].year} 年（${pts[pts.length - 1].year + 1} 年起超出節氣資料範圍 1930–2050，依師承紀律不外推）。` : '';
    const sw = specialPatternScoreProfile(chart);
    return `\n    <h2>流年運勢曲線（全人生）</h2>\n    ${svg}\n    <p class="note">流年 v2 六構面計分：①當年大運五構面分 × 1/2 ②流年干支喜忌（普通基準干±10、支±20；本盤${sw.isWeighted ? sw.label + '，干±' + sw.stemScore + '、支±' + sw.branchScore : '無特殊加權'}）③納音五行喜忌 ±10 ④神煞（天乙、文昌、天德、月德、德秀、金輿 +10；劫煞、災煞、庫煞、亡神 −10，同名三煞去重）⑤流年與本命日柱／當年大運柱之天干沖合、地支刑沖剋合（合沖剋±10、刑−5）⑥十二長生：祿+20、長生+10、羊刃−10、絕−15。特殊格只放大②流年本柱干支喜忌，其餘構面不加權。縱軸依本盤流年分數幅度正規化；上方金字為各步大運干支、下方為起運歲，金圈為今年。${truncNote}此為運勢傾向示意，非吉凶宣判。</p>`;
  } catch (e) { console.error('annualCurveHtml', e); return ''; }
}

function renderChart(chart) {
  const p = chart.pillars;
  const tg = chart.fullTenGods;
  const dm = chart.dayMaster;

  const pillarOrder = [
    { key: 'hourPillar', label: '時柱' },
    { key: 'dayPillar', label: '日柱' },
    { key: 'monthPillar', label: '月柱' },
    { key: 'yearPillar', label: '年柱' }
  ];

  let pillarsHtml = '<div class="pillars-grid">';
  pillarOrder.forEach(po => {
    const data = tg[po.key];
    const isDayPillar = po.key === 'dayPillar';
    const hiddenHtml = data.branchHiddenStems.map(h =>
      `${h.stem}<span class="tg">(${h.tenGod})</span>`
    ).join('　');
    const naYin = (window.BaziEngine && BaziEngine.getNaYin) ? BaziEngine.getNaYin(data.stem + data.branch) : '';
    pillarsHtml += `
      <div class="pillar-card ${isDayPillar ? 'pillar-day' : ''}">
        <div class="pillar-label">${po.label}</div>
        <div class="pillar-tengod">${data.stemTenGod}</div>
        <div class="pillar-stem ${elClass(data.stemElement)}">${data.stem}</div>
        <div class="pillar-branch ${elClass(data.branchElement)}">${data.branch}</div>
        <div class="hidden-stems">${hiddenHtml}</div>
        <div class="pillar-nayin">${naYin || '—'}</div>
      </div>`;
  });
  pillarsHtml += '</div>';

  // 五行分布條
  const dist = chart.elementDistribution;
  const maxVal = Math.max(...Object.values(dist.counts));
  let barsHtml = '<div class="element-bars">';
  ['木', '火', '土', '金', '水'].forEach(el => {
    const val = dist.counts[el];
    const pct = maxVal > 0 ? (val / maxVal * 100) : 0;
    barsHtml += `
      <div class="element-bar-row">
        <div class="element-bar-label el-${el}">${el}</div>
        <div class="element-bar-track"><div class="element-bar-fill bar-${el}" style="width:${pct}%"></div></div>
        <div class="element-bar-val">${val} 分 (${dist.percentages[el]}%)</div>
      </div>`;
  });
  barsHtml += '</div>';

  // 身強身弱（預留）
  let strengthHtml = '';
  if (chart.strength && chart.strength._notImplemented) {
    strengthHtml = `<p class="note">${chart.strength.summary}</p>`;
  } else if (chart.strength && chart.strength.level) {
    strengthHtml = `<p><span class="strong">${chart.strength.level}</span>　${chart.strength.summary || ''}</p>`;
    const settle = (chart.strength.details && chart.strength.details.settlement) || [];
    if (settle.length) {
      strengthHtml += `<p class="note">前置結算（先沖、再看化神透干與拱局）：${settle.map(a => `${a.note}（${a.side}方${a.delta > 0 ? '+' : ''}${a.delta}${a.element}）`).join('；')}</p>`;
    } else {
      strengthHtml += `<p class="note">前置結算：本盤地支無沖合成局，八分法直接統計。</p>`;
    }
    const det = chart.strength.details || {};
    const spd = det.specialPatternDecision || {};
    function specialPatternHtml(label, data) {
      if (!data) return '';
      const pattern = data.pattern ? `（${data.pattern}）` : '';
      let h = `<p><strong>${label}：</strong><span class="strong">${data.status || '—'}</span>${pattern}</p>`;
      h += `<p class="note">${data.summary || ''}</p>`;
      if (!/^正格$/.test(data.status || '') && (data.evidence || []).length) h += `<p class="note">成立依據：${data.evidence.join('；')}</p>`;
      if ((data.counterEvidence || []).length && !/^正格$/.test(data.status || '')) h += `<p class="note">保留條件：${data.counterEvidence.join('；')}</p>`;
      return h;
    }
    const mp = det.monthPattern;
    const specialRows = [
      {label:'化氣格判定', data:det.huaQi},
      {label:'專旺格判定', data:det.zhuanWang},
      {label:'從格判定', data:det.congGe}
    ].filter(x=>x.data && x.data.status && x.data.status !== '正格');
    const hasMonthSpecial = !!(mp && mp.status === '成立' && mp.type);
    if (specialRows.length || hasMonthSpecial) {
      const scoringProfile = specialPatternScoreProfile(chart);
      strengthHtml += `<h3>特殊格局裁定</h3>`;
      strengthHtml += `<p><strong>目前主規則：</strong><span class="strong">${spd.active ? `${spd.active.family}・${spd.active.pattern}` : '正格'}</span></p>`;
      specialRows.forEach(x=>{ strengthHtml += specialPatternHtml(x.label, x.data); });
      if (hasMonthSpecial) {
        strengthHtml += `<p><strong>建祿／月刃：</strong><span class="strong">${mp.type}</span></p>`;
        strengthHtml += `<p class="note">${mp.summary || ''}</p>`;
      }
      strengthHtml += `<p class="note">干支喜忌加權：${scoringProfile.isWeighted ? '大運與流年本柱的天干±' + scoringProfile.stemScore + '、地支±' + scoringProfile.branchScore + '（×' + scoringProfile.multiplier + '）' : '疑似格仍按普通正格計分，尚不加權'}。</p>`;
    }
    const rp = det.regularMonthPattern;
    strengthHtml += `<h3>月令八種正格・成敗救應</h3>`;
    if (rp && rp.status === '已取格') {
      strengthHtml += `<p><strong>取格：</strong><span class="strong">${rp.pattern || '—'}</span>　<strong>判定：</strong><span class="strong">${rp.verdict || '待核'}</span></p>`;
      strengthHtml += `<p class="note">來源：${rp.sourcePosition || '—'}</p>`;
      strengthHtml += `<p class="note">成格線索：${(rp.activeSuccess || []).map(x=>x.label).join('、') || '尚無明顯成格線索'}</p>`;
      strengthHtml += `<p class="note">破格線索：${(rp.activeFailures || []).map(x=>x.label).join('、') || '未見明顯破格線索'}</p>`;
      strengthHtml += `<p class="note">救應：${(rp.activeRescues || []).map(x=>x.label).join('、') || '本盤目前無需或未見成立的救應'}</p>`;
    } else if (rp) {
      strengthHtml += `<p><strong>取格：</strong><span class="strong">${rp.pattern || rp.verdict || '未取八格'}</span></p>`;
      strengthHtml += `<p class="note">${rp.summary || ''}</p>`;
    }
    strengthHtml += `<p class="note">※ 月令正格與成敗救應現階段只作結構解讀，不參與喜用神或曲線計分。</p>`;
    const outer = det.classicalOuterPatterns || [];
    if (outer.length) {
      strengthHtml += `<h3>古法外格標籤（不影響曲線）</h3>`;
      strengthHtml += `<p>${outer.map(x=>`<span class="strong" title="${(x.evidence || []).concat(x.blockers || []).join('；')}">${x.name}</span>`).join('　')}</p>`;
    }
  }

  const ys = chart.yongShen || {};
  const alts = (ys.alternatives && ys.alternatives.length) ? ys.alternatives : (ys.alternative ? [ys.alternative] : []);
  const yongHtml = `
    <table class="info-table">
      <tr><td>判定方法</td><td>${ys.method || '—'}</td></tr>
      <tr><td>喜用五行</td><td class="strong">${(ys.favorable || []).join('、') || '—'}</td></tr>
      <tr><td>忌神五行</td><td>${(ys.unfavorable || []).join('、') || '—'}</td></tr>
      <tr><td>中性五行</td><td>${(ys.neutral || []).join('、') || '—'}</td></tr>
    </table>
    <p class="note">${ys.summary || ''}</p>
    ${alts.length ? `<h3>疑似特殊格局備選喜忌（不參與目前曲線）</h3>${alts.map((alt,i)=>`
    <table class="info-table">
      <tr><td>備選 ${i+1}</td><td>${alt.method || '—'}</td></tr>
      <tr><td>備選喜用</td><td class="strong">${(alt.favorable || []).join('、') || '—'}</td></tr>
      <tr><td>備選忌神</td><td>${(alt.unfavorable || []).join('、') || '—'}</td></tr>
      <tr><td>備選中性</td><td>${(alt.neutral || []).join('、') || '—'}</td></tr>
    </table><p class="note">${alt.summary || ''}</p>`).join('')}` : ''}`;

  const luckCurve = luckCurveHtml(chart);
  const annualCurve = annualCurveHtml(chart);

  const html = `
    <h2>四柱八字</h2>
    ${pillarsHtml}
    <p class="note">日柱（金色）為命主本身。每柱下方為地支藏干與其十神。</p>

    <h2>日主</h2>
    <div class="daymaster-card">
      <div class="daymaster-main">${dm.stem}　${dm.label}（${dm.archetype}）</div>
      <div class="daymaster-desc">本性：${dm.nature}</div>
    </div>

    <h2>五行分布</h2>
    ${barsHtml}
    <p class="note">天干 1 分、地支主氣 1 分、中氣 0.5 分、餘氣 0.3 分。此為五行能量統計，非身強身弱判定。</p>

    <h2>身強身弱</h2>
    ${strengthHtml}

    <h2>喜用神</h2>
    ${yongHtml}

    <h2>空亡</h2>
    <table class="info-table">
      <tr><td>空亡地支</td><td class="strong">${chart.kongWang.join('、') || '無'}</td></tr>
    </table>
    ${luckCurve}
    ${annualCurve}

    <h2>細盤 · 大運 / 流年 / 流月 / 流日</h2>
    <div class="annual-input">
      <span style="color:var(--muted);font-size:0.85rem">查詢日期：</span>
