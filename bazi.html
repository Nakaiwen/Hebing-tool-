      <input type="number" id="q-year" placeholder="年" min="1930" max="2050" value="${new Date().getFullYear()}" style="width:80px" title="節氣資料範圍 1930–2050">
      <input type="number" id="q-month" placeholder="月" min="1" max="12" value="${new Date().getMonth()+1}" style="width:56px">
      <input type="number" id="q-day" placeholder="日" min="1" max="31" value="${new Date().getDate()}" style="width:56px">
      <button class="btn-ghost" onclick="queryGrid()">更新</button>
    </div>
    <div id="grid-result"></div>
    <p class="note">大運、流年、流月、流日皆以上方查詢日期為基準（預設為今日）。欄位由右至左為「時 日 月 年」本命四柱，左半為動態流曜。</p>
    <details style="margin-top:10px" open>
      <summary style="cursor:pointer;color:var(--muted);font-size:0.85rem">動態層深度分析（合會刑沖破害・吉凶・養生方向）</summary>
      <div id="layers-result" style="margin-top:10px"></div>
    </details>

    <h2>年命擇吉（命主吉凶日）</h2>
    <p class="note">以年柱天干論命主專屬擇日（師承規則）。下列日子已按「天干地支皆吉／皆凶」篩出。</p>
    <div id="zeji-result"></div>

    <h2>命盤存檔</h2>
    <p class="note">「存檔」會把這張命盤（含細盤與動態層）下載成 .json；日後用「讀取檔案」載回即可重排，命書 Skill 也吃同一份檔。</p>
    <div class="btn-row">
      <button class="btn-primary" onclick="downloadJson()">存檔</button>
      <button class="btn-ghost" onclick="document.getElementById('load-file').click()">讀取檔案</button>
    </div>
  `;

  document.getElementById('result').innerHTML = html;
  queryGrid(); // 預設以今天為基準排細盤
  renderZeJi(chart); // 年命擇吉（命主吉凶日）
}

// ── 細盤表格 ──────────────────────────────────────────────
function renderDetailGrid(grid) {
  const cols = grid.columns;
  // 每列定義：key = cell 欄位，label = 列標題，render = 自訂渲染
  const rows = [
    { label: '主星', render: c => `<span class="main-star">${c.mainStar || '—'}</span>` },
    { label: '天干', render: (c, col) => c.stem ? `<span class="gz-char stem ${elClass(c.stemElement)}">${c.stem}</span>` : '—' },
    { label: '地支', render: c => c.branch ? `<span class="gz-char ${elClass(c.branchElement)}">${c.branch}</span>` : '—' },
    { label: '藏干', render: c => c.hiddenStems && c.hiddenStems.length
        ? `<div class="hidden-cell">${c.hiddenStems.map(h => `<span class="hs-row">${h.stem}<span class="hs-tg">${h.tenGod}</span></span>`).join('<br>')}</div>`
        : '—' },
    { label: '星運', render: c => `<span class="stage-cell">${c.xingYun || '—'}</span>` },
    { label: '自坐', render: c => `<span class="stage-cell">${c.ziZuo || '—'}</span>` },
    { label: '空亡', render: c => `<span class="kw-cell">${(c.kongWang && c.kongWang.length) ? c.kongWang.join('') : '—'}</span>` },
    { label: '納音', render: c => `<span class="nayin-cell">${c.naYin || '—'}</span>` },
    { label: '神煞', render: c => (c.shenSha && c.shenSha.length)
        ? `<div class="shensha-cell">${c.shenSha.map(s => `<span class="ss-item${['天乙貴人','自坐貴人','天德','月德'].indexOf(s) !== -1 ? ' ss-guiren' : ''}">${s}</span>`).join('')}</div>`
        : `<span class="shensha-cell"><span class="ss-none">—</span></span>` }
  ];

  // 欄位 class：動態欄底色、年柱分隔線、日柱高亮
  function colClass(col, idx) {
    let cls = [];
    if (col.dynamic) cls.push('col-dyn');
    if (col.role === '時柱') cls.push('col-sep'); // 本命/動態分界（時柱為本命最左欄）
    if (col.isDay) cls.push('col-day');
    return cls.join(' ');
  }

  let html = '<div class="detail-wrap"><table class="detail-table"><thead><tr>';
  html += '<th class="row-head"></th>';
  cols.forEach((col, idx) => {
    html += `<th class="${colClass(col, idx)}"><span class="col-name">${col.role}</span><span class="col-sub">${col.sub || ''}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(row => {
    html += `<tr><td class="row-head">${row.label}</td>`;
    cols.forEach((col, idx) => {
      const isEmpty = !col.cell.pillar;
      html += `<td class="${colClass(col, idx)}${isEmpty ? ' empty-cell' : ''}">${row.render(col.cell, col)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // 大運說明
  const L = grid.luck;
  const dir = L.forward ? '順排' : '逆排';
  html += `<p class="detail-luck-note">大運${dir}，約 <span class="strong">${L.startAgeLabel}</span> 起運。`;
  if (L.current) {
    html += `目前行至 <span class="strong">${L.current.pillar}</span> 運（${Math.floor(L.current.startAge)} 歲起）。`;
  } else {
    html += `查詢日期時尚未起運（行運前由本命月柱主導）。`;
  }
  html += '</p>';
  return html;
}

function queryGrid() {
  if (!currentChart) return;
  const year = parseInt(document.getElementById('q-year').value);
  const month = parseInt(document.getElementById('q-month').value);
  const day = parseInt(document.getElementById('q-day').value);
  if (!year || !month || !day) return;

  const grid = BaziEngine.buildDetailGrid(currentChart, year, month, day);
  document.getElementById('grid-result').innerHTML = renderDetailGrid(grid);

  currentChart.detailGrid = grid;
  queryDynamics(); // 折疊區：動態層深度分析（合會刑破害＋吉凶＋養生）＋ 寫進 JSON
}

// ── 動態層深度分析（折疊區）──────────────────────────────
function verdictBadge(v) {
  if (!v) return '';
  const cls = (v.indexOf('吉') > -1 && v.indexOf('凶') > -1) ? 'v-mix'
    : (v.indexOf('吉') > -1 ? 'v-good' : (v.indexOf('凶') > -1 ? 'v-bad' : 'v-mid'));
  return `<span class="verdict ${cls}">${v}</span>`;
}

function renderCrossList(list) {
  return '<ul class="dyn-rel-list">' + list.map(r => {
    let name;
    if (r.kind === '三合') name = (r.complete === false ? '半合' : '三合') + (r.transformsTo ? '化' + r.transformsTo : '');
    else if (r.kind === '三會') name = (r.complete === false ? '半會' : '三會') + (r.transformsTo ? '化' + r.transformsTo : '');
    else if (r.kind === '刑') name = (r.complete === false ? '半刑' : '刑') + (r.type ? '・' + r.type : '');
    else name = r.kind + (r.transformsTo ? '化' + r.transformsTo : '');
    const detail = (r.involved || []).join('') + '（' + (r.pillars || []).join('・') + '）';
    let li = `<li><span class="dyn-rel-kind">${name}</span> ${detail}`;
    if (r.gentleReminder) li += `<span class="dyn-rel-note">${r.gentleReminder}</span>`;
    return li + '</li>';
  }).join('') + '</ul>';
}

function renderDynamics(dyn) {
  if (!dyn || !dyn.layers) return '<p class="dyn-pending">無動態層資料。</p>';
  const order = [['daYun', '大運'], ['annual', '流年']];
  let html = '';
  order.forEach(pair => {
    const key = pair[0], label = pair[1];
    const Lr = dyn.layers[key];
    if (!Lr || !Lr.pillar) {
      html += `<div class="dyn-layer"><div class="dyn-head"><span class="dyn-layer-name">${label}</span><span class="dyn-pending">${(Lr && Lr.note) || '未起運／無資料'}</span></div></div>`;
      return;
    }
    html += `<div class="dyn-layer"><div class="dyn-head">
        <span class="dyn-layer-name">${label}</span>
        <span class="dyn-pillar">${Lr.pillar}</span>
        <span class="dyn-tengod">天干「${Lr.stemTenGod}」${Lr.stemRelation ? '・' + Lr.stemRelation : ''}</span>
        ${verdictBadge(Lr.verdict && Lr.verdict.net)}
      </div>`;
    const rels = Lr.relations || [];
    if (rels.length) {
      html += '<ul class="dyn-rel-list">';
      rels.forEach(r => {
        html += `<li><span class="dyn-rel-kind">${r.kind}</span> ${r.reason || ''}${verdictBadge(r.verdict)}`;
        if (r.gentleReminder) html += `<span class="dyn-rel-note">${r.gentleReminder}</span>`;
        html += '</li>';
      });
      html += '</ul>';
    } else {
      html += '<div class="dyn-pending">（無合會刑破害引動）</div>';
    }
    // 六沖
    if (Lr.clashes === null) {
      html += '<div class="dyn-pending">六沖：待資料表（bazi-clash-table）</div>';
    } else if (Lr.clashes.length) {
      html += '<ul class="dyn-rel-list">';
      Lr.clashes.forEach(c => {
        html += `<li><span class="dyn-rel-kind">沖</span> ${c.with}・${c.categoryLabel || ''}${verdictBadge(c.verdict)}`;
        if (c.gentleReminder) html += `<span class="dyn-rel-note">${c.gentleReminder}</span>`;
        html += '</li>';
      });
      html += '</ul>';
    }
    html += '</div>';
  });
  // 大運×流年 牽動本命（三方齊才列）
  const cp = dyn.crossPillar || {};
  if ((cp.natal || []).length) {
    html += `<div class="dyn-layer"><div class="dyn-head"><span class="dyn-layer-name">大運×流年 牽動本命</span></div>` + renderCrossList(cp.natal) + '</div>';
  }
  // 本月時運（大運・流年・流月 彼此）
  html += `<div class="dyn-layer"><div class="dyn-head"><span class="dyn-layer-name">本月時運</span><span class="dyn-tengod">大運・流年・流月 彼此引動</span></div>`
        + ((cp.month || []).length ? renderCrossList(cp.month) : '<div class="dyn-pending">（本月無刑沖破害合會引動）</div>') + '</div>';
  // 本日時運（流日引動）
  html += `<div class="dyn-layer"><div class="dyn-head"><span class="dyn-layer-name">本日時運</span><span class="dyn-tengod">流日引動（今日順逆）</span></div>`
        + ((cp.day || []).length ? renderCrossList(cp.day) : '<div class="dyn-pending">（今日無新增引動）</div>') + '</div>';
  // 養生方向
  const ys = dyn.yangsheng;
  html += `<div class="dyn-layer"><div class="dyn-head"><span class="dyn-layer-name">養生方向</span>${ys && ys.seasonElement ? `<span class="dyn-tengod">當令五行：${ys.seasonElement}</span>` : ''}</div>`;
  if (!ys || ys.pending || !ys.advice) {
    html += `<div class="dyn-pending">${(ys && ys.note) || '待資料表（養生表 bazi-wuxing-health-table）'}</div>`;
  } else {
    const items = ys.advice.filter(a => a.state !== '平');
    if (items.length) {
      html += '<div class="dyn-yangsheng">' + items.map(a =>
        `<div class="ys-item"><span class="ys-el el-${a.element}">${a.element}</span> ${a.state}：${a.advice || ''}</div>`).join('') + '</div>';
    } else {
      html += '<div class="dyn-pending">五行尚屬均衡，無明顯偏旺偏弱。</div>';
    }
  }
  html += '</div>';
  return html;
}

function queryDynamics() {
  if (!currentChart) return;
  const year = parseInt(document.getElementById('q-year').value);
  const month = parseInt(document.getElementById('q-month').value);
  const day = parseInt(document.getElementById('q-day').value);
  if (!year || !month || !day) return;

  let dyn = null;
  if (BaziEngine.analyzeDynamics) {
    try { dyn = BaziEngine.analyzeDynamics(currentChart, year, month, day); } catch (e) { console.error('analyzeDynamics 失敗：', e); }
  }
  if (dyn) {
    currentChart.dynamics = dyn;
    document.getElementById('layers-result').innerHTML = renderDynamics(dyn);
    updateJsonOutput();
  } else {
    queryLayers(); // 後備：舊淺層（天剋地衝）
  }
}

// 渲染單一時間層的分析表格
function renderLayerTable(layer) {
  const i = layer.elementInteraction;
  const t = layer.tenGods;
  let html = `
    <table class="info-table" style="margin-bottom:14px">
      <tr><td style="width:72px"><span class="strong">${layer.layer}</span></td><td><span class="strong" style="font-size:1.1rem">${layer.pillar}</span></td></tr>
      <tr><td>天干關係</td><td>${i.stemAnalysis}</td></tr>
      <tr><td>地支關係</td><td>${i.branchAnalysis}</td></tr>
      <tr><td>天干</td><td><span class="strong">${t.stem.character}</span> 為日主之「<span class="strong">${t.stem.name}</span>」<div class="note">${t.stem.explanation}</div></td></tr>
      <tr><td>地支</td><td><span class="strong">${t.branch.character}</span>（藏${t.branch.hiddenStem}）為日主之「<span class="strong">${t.branch.name}</span>」<div class="note">${t.branch.explanation}</div></td></tr>
  `;
  if (i.isMajorClash) {
    html += `<tr><td>特別提醒</td><td class="clash-warning">此${layer.layer.replace('流','')}為天剋地衝，行事宜保守謹慎，並多注意健康。</td></tr>`;
  }
  html += '</table>';
  return html;
}

function queryLayers() {
  if (!currentChart) return;
  const year = parseInt(document.getElementById('q-year').value);
  const month = parseInt(document.getElementById('q-month').value);
  const day = parseInt(document.getElementById('q-day').value);
  if (!year || !month || !day) return;

  const layers = BaziEngine.analyzeDateLayers(currentChart.pillars.dayPillar, year, month, day);

  const html =
    renderLayerTable(layers.annual) +
    renderLayerTable(layers.monthly) +
    renderLayerTable(layers.daily);

  document.getElementById('layers-result').innerHTML = html;

  // 存進 currentChart 並更新 JSON
  currentChart.dateLayers = layers;
  updateJsonOutput();
}

function updateJsonOutput() {
  const out = document.getElementById('json-output');
  if (out && currentChart) {
    out.value = JSON.stringify(currentChart, null, 2);
  }
}

// 讀取存檔的 .json，還原命盤並重排（含細盤與動態層）
function loadChartFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      alert('讀取失敗：不是有效的 JSON 檔。');
      event.target.value = '';
      return;
    }
    if (!data || !data.pillars || !data.meta) {
      alert('讀取失敗：這份 JSON 不是本工具的命盤存檔。');
      event.target.value = '';
      return;
    }
    // 還原上方表單欄位
    const m = data.meta || {};
    document.getElementById('in-name').value = (m.name && m.name !== '未命名') ? m.name : '';
    if (m.gender) document.getElementById('in-gender').value = m.gender;
    if (m.solarBirth) {
      document.getElementById('in-year').value = m.solarBirth.year || '';
      document.getElementById('in-month').value = m.solarBirth.month || '';
      document.getElementById('in-day').value = m.solarBirth.day || '';
      if (m.solarBirth.hour != null) document.getElementById('in-hour').value = String(m.solarBirth.hour);
    }
    // 直接以存檔內容渲染（renderChart 內部會呼叫 queryGrid 重排細盤＋動態層）
    try {
      currentChart = data;
      renderChart(currentChart);
      event.target.value = ''; // 清空輸入，讓同一檔可再次讀取
      alert('已讀取命盤：' + (m.name || '未命名'));
    } catch (err2) {
      alert('讀取失敗：命盤資料不完整或格式不符。\n' + err2.message);
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

function downloadJson() {
  if (!currentChart) return;
  const name = currentChart.meta.name || '未命名';
  const blob = new Blob([JSON.stringify(currentChart, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `八字命盤-${name}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
<script>
/* ============================================================
   合盤橋接（merge-bridge v1）— 附加式，不修改上方任何原有邏輯
   契約：父頁 postMessage {xl:'xl-merge-bridge', type:'run', input:{name,gender('男'/'女'),year,month,day,hour(0/2/…/22/23)}}
   回傳：{xl:'xl-merge-bridge', from:'bazi', type:'bazi-curve', ok, data|error}
   ============================================================ */
(function(){
  var NS='xl-merge-bridge';
  function post(msg){ try{ parent.postMessage(Object.assign({xl:NS,from:'bazi'},msg),'*'); }catch(e){} }
  /* 大運、流年計分皆直接呼叫共用函式：luckPillarScoreV2 / annualScoreDataV2。
     曲線與合盤橋接同源，禁止另寫鏡射計分。 */
  /* ============================================================
     八字財運訊號（v0.9.28 新增，獨立訊號層，affectsCurve:false）
     ------------------------------------------------------------
     成立條件（大限或流年同一支柱須同時滿足）：
       ① 該柱天干的五行屬於喜用神
       ② 該柱地支為「年干」或「日干」的祿神（該天干十二長生的臨官位）
     身強、身弱皆適用：旺衰差異已由喜用神本身承載——身強與身弱取到的
     喜用神不同，條件①自動區分兩者，不需另立分支。命理上的理由是
     「喜用透干＋祿神通根」使全局趨近平衡，財氣得以落地。
     祿神一律由引擎既有的 getTwelveStage() 反查臨官位取得，不另立對照表。
     本訊號不參與曲線計分，只作獨立標示。
     ============================================================ */
  function luBranchOf(stem){
    if(!stem||!window.BaziEngine||!BaziEngine.getTwelveStage) return null;
    var Z=BaziEngine.constants&&BaziEngine.constants.EARTHLY_BRANCHES;
    if(!Z||!Z.length) return null;
    for(var i=0;i<Z.length;i++){
      if(BaziEngine.getTwelveStage(stem,Z[i])==='臨官') return Z[i];
    }
    return null;
  }
  function baziWealthSignals(chart,cycle,ys,annual){
    var base={schema:'xiaoliu.wealth-signal/v1',source:'bazi',affectsCurve:false,
              rule:'喜用神透干＋年干或日干祿神落於該柱地支',daen:[],annual:[]};
    try{
      var fav=(ys&&ys.favorable)||[];
      var yearStem=chart.pillars.yearPillar.charAt(0),dayStem=chart.pillars.dayPillar.charAt(0);
      var luY=luBranchOf(yearStem),luD=luBranchOf(dayStem);
      var birthY=chart.meta.solarBirth.year;
      var level=(chart.strength&&chart.strength.level)||'';
      base.favorable=fav.slice(); base.strengthLevel=level;
      base.luShen={yearStem:yearStem,yearLu:luY,dayStem:dayStem,dayLu:luD};
      if(!fav.length) return base;
      function hit(gz){
        if(!gz||gz.length<2) return null;
        var gan=gz.charAt(0),zhi=gz.charAt(1);
        var el=BaziEngine.getElementOf(gan);
        if(fav.indexOf(el)<0) return null;
        var from=[];
        if(luY&&zhi===luY) from.push('年干');
        if(luD&&zhi===luD) from.push('日干');
        if(!from.length) return null;
        return {gan:gan,zhi:zhi,ganElement:el,luFrom:from.join('＋'),strengthLevel:level};
      }
      (cycle.pillars||[]).forEach(function(pl,i){
        var h=hit(pl.pillar); if(!h) return;
        var a0=Math.round(pl.startAge),nx=cycle.pillars[i+1];
        var a1=nx?Math.round(nx.startAge)-1:a0+9;
        base.daen.push(Object.assign({gz:pl.pillar,startAge:pl.startAge,
          realAge0:a0,realAge1:a1,y0:birthY+a0,y1:birthY+a1},h));
      });
      (annual||[]).forEach(function(p){
        var h=hit(p.gz); if(!h) return;
        base.annual.push(Object.assign({year:p.year,gz:p.gz,realAge:p.year-birthY},h));
      });
      return base;
    }catch(e){ base.error=String(e&&e.message||e); return base; }
  }
  function curveData(chart){
    if(!chart||!chart.yongShen||!chart.yongShen.favorable||!chart.pillars||!chart.meta) return null;
    if(!(window.BaziEngine&&BaziEngine.getLuckCycle)) return null;
    var ys=chart.yongShen;
    var cycle=BaziEngine.getLuckCycle(chart.meta.solarBirth, chart.meta.gender||'男',
      chart.pillars.yearPillar.charAt(0), chart.pillars.monthPillar);
    if(!cycle||cycle.dataMissing||!cycle.pillars||!cycle.pillars.length) return null;
    var curGz=null;
    try{
      var now=new Date();
      var cur=BaziEngine.getCurrentLuckPillar(cycle, chart.meta.solarBirth, now.getFullYear(), now.getMonth()+1, now.getDate());
      curGz=cur?cur.pillar:null;
    }catch(e){}
    /* 流年逐年 v2：直接使用曲線同源資料（含大運半分基礎與逐項分解）。 */
    var annualData=annualScoreDataV2(chart, cycle);
    var annual=annualData.points, annualTruncated=annualData.truncated;
    return {
      birthYear: chart.meta.solarBirth.year,
      favorable: ys.favorable.slice(),
      unfavorable: (ys.unfavorable||[]).slice(),
      specialScoring: JSON.parse(JSON.stringify(specialPatternScoreProfile(chart))),
      yongShen: {
        method: ys.method||'', favorable: ys.favorable.slice(),
        unfavorable: (ys.unfavorable||[]).slice(), neutral: (ys.neutral||[]).slice(),
        summary: ys.summary||'',
        decision: ys.decision ? JSON.parse(JSON.stringify(ys.decision)) : null,
        alternative: ys.alternative ? JSON.parse(JSON.stringify(ys.alternative)) : null,
        alternatives: ys.alternatives ? JSON.parse(JSON.stringify(ys.alternatives)) : []
      },
      strength: chart.strength ? {
        level: chart.strength.level, confidence: chart.strength.confidence||'',
        score: chart.strength.score, summary: chart.strength.summary||'',
        baseScore: chart.strength.details&&chart.strength.details.baseScore,
        settlement: (chart.strength.details&&chart.strength.details.settlement)||[],
        congGe: chart.strength.details&&chart.strength.details.congGe ? JSON.parse(JSON.stringify(chart.strength.details.congGe)) : null,
        zhuanWang: chart.strength.details&&chart.strength.details.zhuanWang ? JSON.parse(JSON.stringify(chart.strength.details.zhuanWang)) : null,
        huaQi: chart.strength.details&&chart.strength.details.huaQi ? JSON.parse(JSON.stringify(chart.strength.details.huaQi)) : null,
        monthPattern: chart.strength.details&&chart.strength.details.monthPattern ? JSON.parse(JSON.stringify(chart.strength.details.monthPattern)) : null,
        regularMonthPattern: chart.strength.details&&chart.strength.details.regularMonthPattern ? JSON.parse(JSON.stringify(chart.strength.details.regularMonthPattern)) : null,
        classicalOuterPatterns: chart.strength.details&&chart.strength.details.classicalOuterPatterns ? JSON.parse(JSON.stringify(chart.strength.details.classicalOuterPatterns)) : [],
        specialPatternDecision: chart.strength.details&&chart.strength.details.specialPatternDecision ? JSON.parse(JSON.stringify(chart.strength.details.specialPatternDecision)) : null
      } : null,
      wealthSignals: baziWealthSignals(chart, cycle, ys, annual),
      startAge: cycle.startAge,
      curGz: curGz,
      pillars: cycle.pillars.map(function(pl){
        var gz=pl.pillar;
        var r=luckPillarScoreV2(chart, gz);
        return { gz:gz, startAge:pl.startAge, score:r.total, parts:r.parts, specialScoring:r.specialScoring };
      }),
      annual: annual,
      annualTruncated: annualTruncated
    };
  }
  window.addEventListener('message',function(ev){
    var d=ev.data; if(!d||d.xl!==NS||d.type!=='run') return;
    try{
      var i=d.input;
      document.getElementById('in-name').value=i.name||'';
      document.getElementById('in-gender').value=i.gender;
      document.getElementById('in-year').value=i.year;
      document.getElementById('in-month').value=i.month;
      document.getElementById('in-day').value=i.day;
      document.getElementById('in-hour').value=String(i.hour);
      runChart();
      if(typeof currentChart!=='undefined' && currentChart){
        var data=curveData(currentChart);
        if(data) post({type:'bazi-curve', ok:true, data:data});
        else post({type:'bazi-curve', ok:false, error:'曲線資料不足（喜用神或大運資料缺）'});
      } else post({type:'bazi-curve', ok:false, error:'排盤未成功'});
    }catch(e){ post({type:'bazi-curve', ok:false, error:String(e&&e.message||e)}); }
  });
  post({type:'ready'});
})();
</script>
